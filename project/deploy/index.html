wups, del);\n      if(JSON.stringify(merged)!==JSON.stringify(this.state.followups||[]) || JSON.stringify(del)!==JSON.stringify(this.state.fuDeleted||[]))\n        this.setState({followups:merged, fuDeleted:del}, ()=>this.save({}));\n      if(JSON.stringify(merged)!==JSON.stringify(doc.followups||[]) || JSON.stringify(del)!==JSON.stringify(doc.deleted||[]))\n        this.pushFollowups(uid, merged, del);\n    });\n  }\n  createFollowup(entry, fileName, recs){\n    const now = Date.now();\n    const id = \"fu\"+now.toString(36)+Math.random().toString(36).slice(2,6);\n    const rows = (recs||[]).map(r=>({ code:String(r.code||\"\"), name:r.name||\"\", sys:r.sys||0, cnt:r.cnt||0,\n      vr:r.vr||0, cost:r.cost||0, ttl:r.ttl||0, status:\"open\", note:\"\" }));\n    const fu = { id:id, ts:now, updatedAt:now, stocktakeId:this.entryId(entry),\n      title:entry.title||\"Stocktake\", when:entry.when||\"\", source:fileName||\"variance.xlsx\", rows:rows };\n    const list = (this.state.followups||[]).concat([fu]);\n    const uid = this.state.owner;\n    this.setState({followups:list, discView:id, discQuery:\"\", discLoc:\"\", discSheet:null, discRecount:\"\",\n      discNewFor:null, discNewFile:\"\", discNewRecs:null, discNewErr:\"\", screen:\"discView\"},\n      ()=>{ this.save({}); if(uid) this.pushFollowups(uid, list, this.state.fuDeleted); });\n  }\n  patchFollowupItem(fid, idx, patch){\n    const list = (this.state.followups||[]).map(f=>{\n      if(f.id!==fid) return f;\n      const rows = (f.rows||[]).map((r,i)=> i===idx ? Object.assign({}, r, patch) : r);\n      return Object.assign({}, f, {rows:rows, updatedAt:Date.now()});\n    });\n    const uid = this.state.owner;\n    this.setState({followups:list}, ()=>{ this.save({}); if(uid) this.pushFollowups(uid, list, this.state.fuDeleted); });\n  }\n  /* Confirm or recount one product in one location within a follow-up. s is\n     \"good\" (the counted amount is correct), \"recount\" (v is the new physical\n     count), or null to clear. Stored per item under row.checks[loc]. */\n  setLocCheck(fid, idx, loc, st, v){\n    const list = (this.state.followups||[]).map(f=>{\n      if(f.id!==fid) return f;\n      const rows = (f.rows||[]).map((r,i)=>{\n        if(i!==idx) return r;\n        const checks = Object.assign({}, r.checks||{});\n        if(st===null) delete checks[loc]; else checks[loc] = {s:st, v:(v==null?0:v), at:Date.now()};\n        return Object.assign({}, r, {checks:checks});\n      });\n      return Object.assign({}, f, {rows:rows, updatedAt:Date.now()});\n    });\n    const uid = this.state.owner;\n    this.setState({followups:list, discSheet:null, discRecount:\"\"}, ()=>{ this.save({}); if(uid) this.pushFollowups(uid, list, this.state.fuDeleted); });\n  }\n  deleteFollowup(id){\n    if(!id){ this.setState({confirm:null, pendingDelete:null}); return; }\n    const list = (this.state.followups||[]).filter(f=>f.id!==id);\n    const del = this.mergeDeleted(this.state.fuDeleted, [id]);\n    const uid = this.state.owner;\n    this.setState({followups:list, fuDeleted:del, confirm:null, pendingDelete:null, discView:null, screen:\"disc\"},\n      ()=>{ this.save({}); if(uid) this.pushFollowups(uid, list, del); });\n  }\n\n  /* ---- variance-report parsing (reuses the xlsx zip reader; returns raw rows\n     per sheet so the variance columns can be picked out separately from the\n     product-import parser). ---- */\n  async xlsxAllSheets(buf){\n    const dv = new DataView(buf.buffer, buf.byteOffset, buf.byteLength);\n    let eocd=-1;\n    for(let i=buf.length-22;i>=0;i--){ if(dv.getUint32(i,true)===0x06054b50){ eocd=i; break; } }\n    if(eocd<0) return [];\n    const n=dv.getUint16(eocd+10,true), cd=dv.getUint32(eocd+16,true);\n    let p=cd; const map={};\n    for(let i=0;i<n;i++){\n      const nl=dv.getUint16(p+28,true), el=dv.getUint16(p+30,true), cl=dv.getUint16(p+32,true);\n      map[new TextDecoder().decode(buf.slice(p+46,p+46+nl))]=dv.getUint32(p+42,true);\n      p+=46+nl+el+cl;\n    }\n    const get = async (nm)=>{\n      if(map[nm]===undefined) return \"\";\n      const lho=map[nm], nl=dv.getUint16(lho+26,true), el=dv.getUint16(lho+28,true);\n      const method=dv.getUint16(lho+8,true), cs=dv.getUint32(lho+18,true), start=lho+30+nl+el;\n      const data = cs===0 ? buf.slice(start) : buf.slice(start, start+cs);\n      if(method===0) return new TextDecoder().decode(data);\n      return await new Response(new Blob([data]).stream().pipeThrough(new DecompressionStream(\"deflate-raw\"))).text();\n    };\n    const dec = (s)=>String(s).replace(/&lt;/g,\"<\").replace(/&gt;/g,\">\").replace(/&quot;/g,'\"').replace(/&apos;/g,\"'\").replace(/&#x([0-9a-f]+);/gi,(m,h)=>String.fromCharCode(parseInt(h,16))).replace(/&#(\\d+);/g,(m,d)=>String.fromCharCode(+d)).replace(/&amp;/g,\"&\");\n    const ssXml = await get(\"xl/sharedStrings.xml\");\n    const strs = (ssXml.match(/<si>[\\s\\S]*?<\\/si>/g)||[]).map(si=>\n      dec((si.match(/<t[^>]*>[\\s\\S]*?<\\/t>/g)||[]).map(t=>t.replace(/<[^>]+>/g,\"\")).join(\"\")));\n    const wb = await get(\"xl/workbook.xml\");\n    const rels = await get(\"xl/_rels/workbook.xml.rels\");\n    const rmap = {};\n    (rels.match(/<Relationship [^>]*>/g)||[]).forEach(r=>{\n      const id=(r.match(/Id=\"([^\"]+)\"/)||[])[1], t=(r.match(/Target=\"([^\"]+)\"/)||[])[1];\n      if(id&&t) rmap[id]=t.replace(/^\\/?xl\\//,\"\");\n    });\n    const sheets=[];\n    (wb.match(/<sheet [^>]*>/g)||[]).forEach(sh=>{\n      const rid=(sh.match(/r:id=\"([^\"]+)\"/)||[])[1]; const tgt=rmap[rid];\n      if(tgt) sheets.push({name:(sh.match(/name=\"([^\"]+)\"/)||[])[1]||\"\", target:tgt});\n    });\n    if(!sheets.length) sheets.push({name:\"\", target:\"worksheets/sheet1.xml\"});\n    const toRows = (xml)=>{\n      const rows=[];\n      (xml.match(/<row[\\s\\S]*?<\\/row>|<row[^>]*\\/>/g)||[]).forEach(r=>{\n        const cells=[];\n        (r.match(/<c [^>]*\\/>|<c [^>]*>[\\s\\S]*?<\\/c>/g)||[]).forEach(c=>{\n          const ref=(c.match(/r=\"([A-Z]+)/)||[])[1]||\"A\";\n          let ci=0; for(let i=0;i<ref.length;i++) ci=ci*26+(ref.charCodeAt(i)-64); ci--;\n          const isStr=/t=\"s\"/.test(c);\n          const inline=(()=>{ const m=(c.match(/<is>[\\s\\S]*?<t[^>]*>([\\s\\S]*?)<\\/t>/)||[])[1]; return m===undefined?undefined:dec(m); })();\n          const v=(c.match(/<v>([\\s\\S]*?)<\\/v>/)||[])[1];\n          cells[ci] = inline!==undefined ? inline : (v===undefined ? \"\" : (isStr ? strs[+v] : v));\n        });\n        rows.push(cells);\n      });\n      return rows;\n    };\n    const out=[];\n    for(const sh of sheets){ out.push({name:sh.name, rows:toRows(await get(\"xl/\"+sh.target))}); }\n    return out;\n  }\n  parseVarianceRows(rows){\n    const txt=(v)=>String(v==null?\"\":v).trim();\n    let hdr=-1;\n    for(let i=0;i<Math.min(rows.length,15);i++){\n      const low=(rows[i]||[]).map(c=>txt(c).toLowerCase());\n      if(low.some(v=>v===\"item\") && low.some(v=>/system\\s*qty/.test(v))){ hdr=i; break; }\n    }\n    if(hdr<0) return null;\n    const H=(rows[hdr]||[]).map(c=>txt(c).toLowerCase());\n    const col=(rx)=>H.findIndex(h=>rx.test(h));\n    const ci={ code:col(/^item$/), name:col(/description/), sys:col(/system\\s*qty/),\n      cnt:col(/count\\s*qty/), vr:col(/^var$/), cost:col(/unit\\s*cost/), ttl:col(/ttl\\s*var|total\\s*var|var\\s*\\$/) };\n    if(ci.code<0 || ci.name<0) return null;\n    const num=(v)=>{ const n=parseFloat(String(v==null?\"\":v).replace(/,/g,\"\")); return isFinite(n)?n:0; };\n    const out=[];\n    for(let i=hdr+1;i<rows.length;i++){\n      const r=rows[i]||[]; const code=txt(r[ci.code]);\n      if(!/^\\d+$/.test(code)) continue;\n      const name=txt(r[ci.name]); if(!name) continue;\n      out.push({ code:code, name:name,\n        sys:num(r[ci.sys]), cnt:num(r[ci.cnt]), vr:num(r[ci.vr]),\n        cost:num(r[ci.cost]), ttl:num(r[ci.ttl]) });\n    }\n    return out.length ? out : null;\n  }\n  async readVarianceFile(file){\n    const name=(file.name||\"\").toLowerCase();\n    if(name.endsWith(\".csv\")){\n      const rows=(await file.text()).split(/\\r?\\n/).filter(l=>l.length).map(l=>this.splitCsvLine(l));\n      return this.parseVarianceRows(rows);\n    }\n    const sheets = await this.xlsxAllSheets(new Uint8Array(await file.arrayBuffer()));\n    for(const sh of sheets){ const v=this.parseVarianceRows(sh.rows); if(v) return v; }\n    return null;\n  }\n\n  /* ======================= Bar Ordering =======================\n     Reads Crown \"EVENT ORDER\" (BEO) PDFs, works out the beverages each event\n     needs, totals them across every BEO, and exports an order sheet.\n     Two kinds of BEO are handled (hybrid):\n       \u2022 Package BEO  \u2013 names a beverage package (\"Crown Reserve Package\",\n         \"Crown Deluxe Package\", \u2026) + a pax count; quantities are derived with\n         the Bar Order spreadsheet formulas (Parameters + per-tier wines).\n       \u2022 Explicit BEO \u2013 lists exact bottle counts (\"540 x bottles of X\");\n         those are used as-is.\n     Everything the parser guesses (tier, pax, tables, event, bars, hours) is\n     editable per block, because BEO wording/layout varies. */\n  boData(){\n    return {\n      // Parameters sheet \u2013 consumption rates\n      params: {\n        beerPremier:{football:5, corporate:3, wedding:3},  // per person\n        beerLight:  {football:3, corporate:2, wedding:2},  // per table\n        redWine:2.5, whiteWine:2.5, sparkling:4,            // per table\n        lemonsKg:3, limesKg:2 },                            // per bar\n      // Crown Reserve tiers -> signature wine names\n      tiers: {\n        cr1:{label:\"Crown Reserve\", sparkling:\"Woodbrook Vineyards NV Brut Cuvee\", white:\"Brigade Block Semillon Sauvignon Blanc\", red:\"Abilene Shiraz\"},\n        cr2:{label:\"Crown Deluxe\",  sparkling:\"Veuve Tailhan Blanc de Blancs Brut NV\", white:\"Vasse Felix Filius Sauvignon Blanc Semillon\", red:\"Vasse Felix Filius Shiraz\"},\n        cr3:{label:\"Crown Reserve Three\", sparkling:\"Leeuwin Estate Brut\", white:\"Leeuwin Estate Art Series Sauv Blanc\", red:\"Leeuwin Estate Art Series Shiraz\"} },\n      // Cocktail sheet parameters: glasses/person, glasses/bottle, assumption\n      cocktail: [\n        {name:\"Sparkling Wine\", gpp:2, gpb:5, assume:0.3},\n        {name:\"Red Wine 1\", gpp:2, gpb:5, assume:0.15}, {name:\"Red Wine 2\", gpp:2, gpb:5, assume:0.1},\n        {name:\"White Wine 1\", gpp:2, gpb:5, assume:0.2}, {name:\"White Wine 2\", gpp:2, gpb:5, assume:0.15},\n        {name:\"Beer 1\", gpp:3, gpb:1, assume:0.3}, {name:\"Beer 2\", gpp:3, gpb:1, assume:0.25},\n        {name:\"Light Beer 1\", gpp:2, gpb:1, assume:0.1} ]\n    };\n  }\n  boTierOptions(){ const d=this.boData(); return [\n    {key:\"cr1\", label:d.tiers.cr1.label}, {key:\"cr2\", label:d.tiers.cr2.label},\n    {key:\"cr3\", label:d.tiers.cr3.label}, {key:\"cocktail\", label:\"Cocktail\"} ]; }\n  boEventOptions(){ return [ {key:\"football\", label:\"Football\"}, {key:\"corporate\", label:\"Corporate\"}, {key:\"wedding\", label:\"Wedding\"} ]; }\n\n  /* Tables are derived as 10% of pax, rounded up (e.g. 483 pax -> 49). */\n  boTables(pax){ return Math.ceil((+pax||0)/10); }\n  /* Compute one block's requirement. Returns [{name, role, qty}]. The beers\n     named in the BEO block are classified premier/light and the premier/light\n     totals are split across the matching products, so \"Premier Beer\" becomes\n     e.g. Corona and \"Light Beer\" splits across Hahn Premium Light / Hahn Super\n     Dry 3.5 / Heineken Zero. Falls back to a generic line if none are listed. */\n  boCompute(block, beo, master){\n    const d=this.boData();\n    const pax=+block.pax||0, tables=this.boTables(pax), bars=+(beo.bars)||0, hours=+block.hours||0;\n    const ev=beo.event||\"corporate\";\n    if(block.tier===\"cocktail\"){\n      const out=d.cocktail.map(c=>({name:c.name, role:c.name, qty:((pax*hours*c.gpp)/c.gpb)*c.assume}));\n      out.push({name:\"Lemons (kg)\", role:\"Lemons\", qty:2*bars});\n      out.push({name:\"Limes (kg)\", role:\"Limes\", qty:1*bars});\n      return out;\n    }\n    const t=d.tiers[block.tier]||d.tiers.cr1;\n    const out=[\n      {name:t.sparkling, role:\"Sparkling\", qty:d.params.sparkling*tables},\n      {name:t.white, role:\"White Wine\", qty:tables*d.params.whiteWine},\n      {name:t.red, role:\"Red Wine\", qty:tables*d.params.redWine} ];\n    const beers=(block.bevs||[]).map(b=>({name:b, cat:this.boClassify(b, master)})).filter(b=>b.cat===\"premier\"||b.cat===\"light\");\n    const prem=beers.filter(b=>b.cat===\"premier\"), lite=beers.filter(b=>b.cat===\"light\");\n    const premTot=pax*d.params.beerPremier[ev], liteTot=tables*d.params.beerLight[ev];\n    if(prem.length) prem.forEach(b=>out.push({name:b.name, role:\"Premier Beer\", qty:premTot/prem.length}));\n    else out.push({name:\"Premier Beer\", role:\"Premier Beer\", qty:premTot});\n    if(lite.length) lite.forEach(b=>out.push({name:b.name, role:\"Light Beer\", qty:liteTot/lite.length}));\n    else out.push({name:\"Light Beer\", role:\"Light Beer\", qty:liteTot});\n    out.push({name:\"Lemons (kg)\", role:\"Lemons\", qty:d.params.lemonsKg*bars});\n    out.push({name:\"Limes (kg)\", role:\"Limes\", qty:bars*d.params.limesKg});\n    return out;\n  }\n  /* Best available product catalogue (with cat/sub) for category matching:\n     the live stocktake master, else the most recent past stocktake snapshot. */\n  boMaster(){\n    const s=this.state;\n    if((s.master||[]).length) return s.master;\n    const a=(s.archive||[]);\n    for(let i=0;i<a.length;i++){ if(a[i] && a[i].snap && (a[i].snap.master||[]).length) return a[i].snap.master; }\n    return [];\n  }\n  boCatLabels(){ return { sparkling:\"Sparkling\", white:\"White wine\", red:\"Red wine\", premier:\"Premier beer\", light:\"Light beer\", \"\":\"No formula\" }; }\n  /* Match a name against the stocktake master list by word overlap and return\n     that product's category (e.g. \"RED WINE\", \"BEER\", \"SPIRITS\"), or \"\" when\n     nothing matches. Used both to categorise a beverage and to recognise one \u2014\n     a priced line that matches a master product is a beverage even if it hits\n     no keyword, so unfamiliar brands aren't missed. */\n  boMasterCat(name, master){\n    if(!(master && master.length)) return \"\";\n    const norm=(x)=>String(x||\"\").trim().toLowerCase().replace(/\\s+/g,\" \");\n    const toks=norm(name).split(\" \").filter(x=>x.length>2 && !/^\\d/.test(x) && x!==\"750ml\" && x!==\"330ml\" && x!==\"ml\");\n    let best=null, bs=0;\n    master.forEach(p=>{ const pn=norm(p.name); let sc=0; toks.forEach(x=>{ if(pn.indexOf(x)>=0) sc++; }); if(sc>bs){ bs=sc; best=p; } });\n    return (best && bs>=2) ? (best.cat||\"\").toUpperCase() : \"\";\n  }\n  /* Classify a beverage name into a Bar Order category. Varietal/beer keywords\n     are the primary signal; the stocktake master's category confirms and, for\n     its non-wine buckets (fortified/dessert, spirits, non-alcoholic), excludes\n     the item from the per-table/per-person formulas. */\n  boClassify(name, master){\n    const light=/light|zero|ultra|mid|low carb|super crisp|3\\.5|crisp/i.test(name);\n    const mc=this.boMasterCat(name, master);\n    if(mc===\"FORTIFIED/DESSERT WINE\"||mc===\"SPIRITS\"||mc===\"NON ALCOHOLIC\") return \"\";\n    if(/sparkling|\\bbrut\\b|cuvee|prosecco|champagne|blanc\\s+de\\s+blancs|\\bnv\\b|methode|cremant|\\bcava\\b/i.test(name)) return \"sparkling\";\n    if(/\\bport\\b|tawny|muscat|sherry|fortified|sticky|liqueur|madeira/i.test(name)) return \"\";\n    /* reds BEFORE whites so \"Cabernet Sauvignon\" is red (not caught by a bare\n       \"sauvignon\"); whites require \"Sauvignon Blanc\"/Semillon/SBS, not just\n       \"sauvignon\" \u2014 Sauvignon Blanc is white, Cabernet Sauvignon is red. */\n    if(/shiraz|syrah|cabernet|\\bcab\\s+sauv|\\bcab\\b|merlot|pinot\\s+noir|tempranillo|grenache|mataro|mourvedre|malbec|\\bgsm\\b|durif|petit\\s+verdot|sangiovese|nebbiolo|barbera|\\bred\\b/i.test(name)) return \"red\";\n    if(/sauvignon\\s+blanc|sauv\\s+blanc|\\bsbs\\b|semillon|chardonnay|riesling|pinot\\s+gris|pinot\\s+grigio|verdelho|viognier|gewurz|chenin|marsanne|fiano|vermentino|\\bwhite\\b/i.test(name)) return \"white\";\n    if(light) return \"light\";\n    if(mc===\"SPARKLING\") return \"sparkling\";\n    if(mc===\"WHITE WINE\") return \"white\";\n    if(mc===\"RED WINE\") return \"red\";\n    if(mc===\"BEER\") return \"premier\";\n    if(/corona|peroni|heineken|asahi|lager|draught|pale ale|amber ale|pilsner|stella|crown lager|carlton|hahn|\\bbeer\\b|cider|pirate|brookvale|good tides|great northern/i.test(name)) return \"premier\";\n    return \"\";\n  }\n  /* Estimate \"on consumption\" open-bar quantities by category. The package\n     parameters give a per-category total (wines/beer by table or pax); where\n     several products share a category, that total is split evenly between\n     them. Returns an array aligned with beo.manual: [{category, est}]. */\n  boConsume(beo, master){\n    const d=this.boData();\n    const pax=+beo.pax||0, ev=beo.event||\"corporate\";\n    let catTotal;\n    if(beo.style===\"cocktail\"){\n      /* Cocktail sheet: per-category total = pax x hours x (glasses-per-person\n         \u00f7 glasses-per-bottle) x assumption(s), summed over that category's\n         cocktail roles (wines gpb 5; beer gpb 1). */\n      const h=+beo.hours||0;\n      catTotal={ sparkling: pax*h*(2/5)*0.3, white: pax*h*(2/5)*(0.2+0.15), red: pax*h*(2/5)*(0.15+0.1),\n        premier: pax*h*3*(0.3+0.25), light: pax*h*2*0.1 };\n    } else {\n      const tables=this.boTables(pax);\n      catTotal={ sparkling:d.params.sparkling*tables, white:tables*d.params.whiteWine, red:tables*d.params.redWine,\n        premier:pax*d.params.beerPremier[ev], light:tables*d.params.beerLight[ev] };\n    }\n    const cats=(beo.manual||[]).map(m=>this.boClassify(m.name, master));\n    const counts={}; cats.forEach(c=>{ if(c) counts[c]=(counts[c]||0)+1; });\n    return cats.map(c=>({ category:c, est: (c && counts[c]) ? (catTotal[c]/counts[c]) : 0 }));\n  }\n  boDetectTier(name, wines){\n    const n=(name||\"\").toLowerCase(), w=(wines||[]).join(\" \").toLowerCase();\n    if(n.includes(\"cocktail\")) return \"cocktail\";\n    if(w.includes(\"leeuwin\")||n.includes(\"three\")||n.includes(\"prestige\")) return \"cr3\";\n    if(n.includes(\"deluxe\")||w.includes(\"vasse felix\")||w.includes(\"veuve tailhan\")) return \"cr2\";\n    return \"cr1\";\n  }\n  parseBEO(text, master){\n    const WINEish=/brut|cuvee|shiraz|sauvignon|semillon|sbs|merlot|chardonnay|\\bcab\\b|tempranillo|rose|blanc|veuve|woodbrook|abilene|vasse|leeuwin/i;\n    const BEERish=/corona|hahn|heineken|asahi|peroni|carlton|crown lager|pirate|great northern|brookvale|good tides|hard rated|pure blonde|little creatures|james squire|rogers|super dry|premium light|soft drink|orange juice|\\bpepsi\\b|lemonade|\\bsolo\\b|tonic|ginger ale|soda water|cider|beer/i;\n    const isHeader=(h)=>{\n      if(/corkage/i.test(h)) return false;\n      if(/crown reserve (one|two|three)/i.test(h)) return true;\n      if(/\\bpackage\\b/i.test(h) && /(reserve|deluxe|prestige|cocktail|beverage|crown)/i.test(h)) return true;\n      if(/cocktail\\s+(package|reception)/i.test(h)) return true;\n      return false;\n    };\n    const lines=String(text||\"\").split(/\\r?\\n/).map(l=>l.replace(/\\s+$/,\"\"));\n    const meta={};\n    const m1=text.match(/BEO#:\\s*(\\d+)/); if(m1) meta.beo=m1[1];\n    const md=text.match(/\\b(?:Mon|Tue|Wed|Thu|Fri|Sat|Sun)[a-z]*\\s+\\d{1,2}\\s+[A-Z][a-z]{2}\\s+\\d{4}/); if(md) meta.date=md[0];\n    const bn=text.match(/Booking Name:\\s*\\n?\\s*(.+)/); if(bn) meta.booking=bn[1].trim();\n    const low=text.toLowerCase();\n    let event=\"corporate\";\n    if(/football club|football/.test(low)) event=\"football\"; else if(/wedding/.test(low)) event=\"wedding\";\n    /* Cocktail-style function (stand-up): uses the Cocktail sheet parameters\n       (per person x hours) rather than the per-table seated rates. Detected\n       from typical cocktail event names. */\n    const cocktail=/sundowner|networking drink|welcome reception|cocktail reception|cocktail party/i.test(text);\n    let tables=0, tm; const trx=/(\\d+)\\s*Banquet round/gi; while((tm=trx.exec(text))) tables+=+tm[1];\n    const hm=text.match(/(\\d+(?:\\.\\d+)?)\\s*Hours/i); const defHours=hm?+hm[1]:0;\n    /* Event headcount. Prefer a \"GUESTS BREAKDOWN\" section and total its guest\n       lines (adults + children + \u2026), excluding non-guests (suppliers, staff,\n       crew, band, security) by each line's FIRST word \u2014 so \"454 Adults\n       (including DJ & MC)\" still counts. Then an explicit \"total \u2026 N guests\".\n       Finally fall back to the largest \"NNN guests @ $\" catering line. */\n    const NONGUEST=/^(supplier|staff|crew|vendor|band|security|contractor|musician|dj|mc|entertainer)/i;\n    let pax=0;\n    for(let i=0;i<lines.length;i++){\n      if(!/guests?\\s*breakdown/i.test(lines[i])) continue;\n      let sum=0, found=false;\n      for(let j=i+1;j<lines.length && j<i+16;j++){\n        const ln=lines[j].trim();\n        if(!ln) continue;\n        if(/^(service note|setup|dietary|technical|health|miscellaneous|billing|beverage|program|menu)\\b/i.test(ln)) break;\n        const gmx=ln.match(/^>\\s*(\\d+)\\s+([A-Za-z].*)$/);\n        if(!gmx) continue;\n        if(NONGUEST.test(gmx[2].trim())) continue;\n        sum+=+gmx[1]; found=true;\n      }\n      if(found && sum>0){ pax=sum; break; }\n    }\n    if(!pax){ const tex=text.match(/total[^\\n]{0,20}?(\\d+)\\s*(?:guests?|pax)\\b/i); if(tex) pax=+tex[1]; }\n    if(!pax){ let pm; const prx=/(\\d+)\\s*guests?\\s*@\\s*\\$/gi; while((pm=prx.exec(text))){ if(+pm[1]>pax) pax=+pm[1]; } }\n    const explicit=[]; const ex=/(?:^|\\n)[>\\s]*?(\\d+)\\s*x\\s*bottles?\\s+of\\s+(.+?)\\s*(?=\\n|$)/gi;\n    let em; while((em=ex.exec(text))) explicit.push({qty:+em[1], name:em[2].trim(), unit:\"bottles\"});\n    /* \"On consumption\" events: cocktails carry planned counts (\"100 x\n       Cosmopolitan\") captured as fixed items; the open-bar list is priced per\n       bottle with no quantity, captured as editable items seeded at 0. */\n    const manual=[];\n    for(let i=0;i<lines.length;i++){\n      if(!/cocktails?\\b.*consumption/i.test(lines[i])) continue;\n      for(let j=i+1;j<lines.length && j<i+40;j++){\n        const ln=lines[j].trim();\n        if(/^\\d+\\s*@\\s*\\$.*per event/i.test(ln)) break;\n        if(isHeader(ln)||/^(setup|dietary|technical|health|miscellaneous|billing|beverage notes)\\b/i.test(ln)) break;\n        const cm=ln.match(/^(\\d+)\\s*x\\s*([A-Za-z][^@]*?)\\s*$/);\n        if(cm && !/banquet|panel|table|chair|pinboard|trestle|stage|step|gate|linen|napkin/i.test(cm[2]))\n          explicit.push({qty:+cm[1], name:cm[2].trim(), unit:\"cocktails\"});\n      }\n    }\n    /* Open-bar (\"Beverages on consumption\") products are priced per\n       bottle/glass/person and the list can be split across pages by an\n       intervening Setup section. So when the BEO has such a block, scan the\n       whole document for drink-priced lines (wine/beer/soft-drink keyword +\n       \"@ $\"), excluding guest-total lines and non-drinks (AV, staff, coffee,\n       furniture). Deduped below. */\n    let consHours=0;\n    if(/beverages?\\s+on\\s+consumption/i.test(text)){\n      const chm=text.match(/beverages?\\s+on\\s+consumption\\s*-\\s*(\\d+(?:\\.\\d+)?)\\s*Hours/i); if(chm) consHours=+chm[1];\n      const NONDRINK=/\\bguests?\\b|per cocktail|per day|per hour|per cart|per quote|per piece|per pass|per line|per night|per item|coffee|\\bcart\\b|internet|\\bstaff\\b|security|\\bchair|\\btable|linen|stage|backdrop|plinth|\\bframe|\\bstand\\b|cork|barista|pinboard|trestle|lectern|microphone|photo|please note|maximum|estimated|spend/i;\n      const FORTish=/\\bport\\b|tawny|muscat|moscato|sherry|madeira|liqueur|aperol|campari|vermouth/i;\n      for(let i=0;i<lines.length;i++){\n        const ln=lines[i].trim();\n        if(!/@\\s*\\$[\\d.,]/.test(ln)) continue;\n        if(NONDRINK.test(ln)) continue;\n        const bm=ln.match(/^(.+?)\\s*@\\s*\\$[\\d.,]+/);\n        if(!bm || !bm[1].trim()) continue;\n        const nmx=bm[1].trim();\n        /* Keep the line if it reads like a drink by keyword OR the stocktake\n           master list recognises the product \u2014 so a drink with an unfamiliar\n           brand name still gets picked up. */\n        if(WINEish.test(ln)||BEERish.test(ln)||FORTish.test(ln)||this.boMasterCat(nmx, master))\n          manual.push({name:nmx, unit:\"bottles\"});\n      }\n    }\n    const blocks=[];\n    for(let i=0;i<lines.length;i++){\n      if(!isHeader(lines[i])) continue;\n      const wines=[], bevs=[]; let pax=0, consumed=i;\n      for(let j=i+1;j<lines.length && j<i+90;j++){\n        const ln=lines[j].trim();\n        const gm=ln.match(/^(\\d+)\\s*guests?\\s*@\\s*\\$/i);\n        if(gm){ pax=+gm[1]; consumed=j; break; }\n        if(isHeader(ln)) break;\n        if(!ln||/^~+$/.test(ln)) continue;\n        if(WINEish.test(ln)){ wines.push(ln); bevs.push(ln); } else if(BEERish.test(ln)) bevs.push(ln);\n      }\n      if(pax>0 && bevs.length>0){   // a real beverage package lists wines/beers; skip food \"Cocktail Reception\" etc.\n        const hh=(lines[i].match(/-\\s*(\\d+(?:\\.\\d+)?)\\s*Hours/i)||[])[1];\n        blocks.push({ rawName:lines[i].trim(), tier:this.boDetectTier(lines[i],wines), pax:pax, hours:hh?+hh:defHours, wines:wines, bevs:bevs });\n        i=consumed;\n      }\n    }\n    const dedupe=(arr, keyFn)=>{ const seen={}, o=[]; arr.forEach(x=>{ const k=keyFn(x); if(!seen[k]){ seen[k]=1; o.push(x); } }); return o; };\n    const nmz=(x)=>String(x||\"\").trim().toLowerCase().replace(/\\s+/g,\" \");\n    return { meta, event, tables, defHours, pax, cocktail, consHours,\n      explicit: dedupe(explicit, e=>nmz(e.name)+\"|\"+e.unit+\"|\"+e.qty),\n      manual: dedupe(manual, m=>nmz(m.name)), blocks };\n  }\n  /* Load pdf.js on demand (text PDFs only). */\n  ensurePdfJs(){\n    if(window.pdfjsLib) return Promise.resolve(window.pdfjsLib);\n    if(this._pdfP) return this._pdfP;\n    const base=\"https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/\";\n    this._pdfP=new Promise((res,rej)=>{\n      const sc=document.createElement(\"script\"); sc.src=base+\"pdf.min.js\";\n      sc.onload=()=>{ try{ window.pdfjsLib.GlobalWorkerOptions.workerSrc=base+\"pdf.worker.min.js\"; }catch(e){} res(window.pdfjsLib); };\n      sc.onerror=()=>{ this._pdfP=null; rej(new Error(\"Couldn\u2019t load the PDF reader. Check your connection and try again.\")); };\n      document.head.appendChild(sc);\n    });\n    return this._pdfP;\n  }\n  async boExtractText(file){\n    const lib=await this.ensurePdfJs();\n    const data=new Uint8Array(await file.arrayBuffer());\n    const pdf=await lib.getDocument({data:data}).promise;\n    let out=\"\";\n    for(let p=1;p<=pdf.numPages;p++){\n      const page=await pdf.getPage(p);\n      const tc=await page.getTextContent();\n      for(const it of tc.items){ out+=it.str; out+= it.hasEOL ? \"\\n\" : \" \"; }\n      out+=\"\\n\";\n    }\n    return out;\n  }\n  /* Bar orders sync per profile (the account's own, keyed bo:<uid>), the same\n     way follow-ups do: merged by id with the newest updatedAt winning, plus a\n     tombstone list so deletes stick across devices. */\n  barKey(uid){ return \"bo:\"+uid; }\n  mergeBarOrders(a, b, del){\n    a=a||[]; b=b||[]; const tomb={}; (del||[]).forEach(id=>{ if(id) tomb[id]=1; });\n    const map={};\n    a.concat(b).forEach(e=>{ if(!e || !e.id || tomb[e.id]) return; const p=map[e.id];\n      if(!p || (e.updatedAt||0) >= (p.updatedAt||0)) map[e.id]=e; });\n    return Object.keys(map).map(k=>map[k]).sort((x,y)=>((x.ts||0)-(y.ts||0)));\n  }\n  pushBarOrders(uid, list, del){\n    if(!uid || !SB.on()) return;\n    SB.put(this.barKey(uid), {barOrders:list||[], deleted:del||this.state.boDeleted||[], ts:Date.now()})\n      .catch(err=>console.error(\"[bar orders] cloud sync failed:\", err));\n  }\n  syncBarOrders(uid){\n    if(!uid || !SB.on() || this.state.joined) return;\n    SB.get(this.barKey(uid)).then(d=>{\n      const doc={ barOrders:(d&&d.barOrders)||[], deleted:(d&&d.deleted)||[] };\n      const del=this.mergeDeleted(this.state.boDeleted, doc.deleted);\n      const merged=this.mergeBarOrders(this.state.barOrders, doc.barOrders, del);\n      if(JSON.stringify(merged)!==JSON.stringify(this.state.barOrders||[]) || JSON.stringify(del)!==JSON.stringify(this.state.boDeleted||[]))\n        this.setState({barOrders:merged, boDeleted:del}, ()=>this.save({}));\n      if(JSON.stringify(merged)!==JSON.stringify(doc.barOrders||[]) || JSON.stringify(del)!==JSON.stringify(doc.deleted||[]))\n        this.pushBarOrders(uid, merged, del);\n    }, ()=>{});\n  }\n  boSave(list){\n    const l=list||this.state.barOrders||[];\n    const uid=this.state.owner;\n    this.setState({barOrders:l}, ()=>{ this.save({}); if(uid) this.pushBarOrders(uid, l, this.state.boDeleted); });\n  }\n  boNew(){\n    const now=Date.now();\n    const id=\"bo\"+now.toString(36)+Math.random().toString(36).slice(2,6);\n    const bo={ id:id, ts:now, updatedAt:now, title:\"Bar order\", beos:[] };\n    const list=(this.state.barOrders||[]).concat([bo]);\n    const uid=this.state.owner;\n    this.setState({barOrders:list, boView:id, boErr:\"\"}, ()=>{ this.save({}); if(uid) this.pushBarOrders(uid, list, this.state.boDeleted); });\n  }\n  boDelete(id){\n    if(!id){ this.setState({confirm:null, pendingDelete:null}); return; }\n    const list=(this.state.barOrders||[]).filter(b=>b.id!==id);\n    const del=this.mergeDeleted(this.state.boDeleted, [id]);\n    const uid=this.state.owner;\n    this.setState({barOrders:list, boDeleted:del, confirm:null, pendingDelete:null, boView:null, screen:\"bo\"}, ()=>{ this.save({}); if(uid) this.pushBarOrders(uid, list, del); });\n  }\n  boPatch(id, patch){\n    const list=(this.state.barOrders||[]).map(b=> b.id===id ? Object.assign({}, b, patch, {updatedAt:Date.now()}) : b);\n    this.boSave(list);\n  }\n  boPatchBeo(id, beoIdx, patch){\n    const list=(this.state.barOrders||[]).map(b=>{\n      if(b.id!==id) return b;\n      const beos=(b.beos||[]).map((e,i)=> i===beoIdx ? Object.assign({}, e, patch) : e);\n      return Object.assign({}, b, {beos:beos, updatedAt:Date.now()});\n    });\n    this.boSave(list);\n  }\n  boPatchBlock(id, beoIdx, blkIdx, patch){\n    const list=(this.state.barOrders||[]).map(b=>{\n      if(b.id!==id) return b;\n      const beos=(b.beos||[]).map((e,i)=>{\n        if(i!==beoIdx) return e;\n        const blocks=(e.blocks||[]).map((bl,k)=> k===blkIdx ? Object.assign({}, bl, patch) : bl);\n        return Object.assign({}, e, {blocks:blocks});\n      });\n      return Object.assign({}, b, {beos:beos, updatedAt:Date.now()});\n    });\n    this.boSave(list);\n  }\n  boRemoveBeo(id, beoIdx){\n    const list=(this.state.barOrders||[]).map(b=>{\n      if(b.id!==id) return b;\n      return Object.assign({}, b, {beos:(b.beos||[]).filter((e,i)=>i!==beoIdx), updatedAt:Date.now()});\n    });\n    this.boSave(list);\n  }\n  /* Parse dropped/selected BEO PDFs and append them to the open order. */\n  boAddFiles(fileList){\n    const id=this.state.boView; if(!id) return;\n    const files=Array.prototype.slice.call(fileList||[]).filter(f=>/\\.pdf$/i.test(f.name||\"\"));\n    if(!files.length) return;\n    this.setState({boBusy:true, boErr:\"\"});\n    const run=files.reduce((chain, file)=> chain.then(()=> this.boExtractText(file).then(text=>{\n      const p=this.parseBEO(text, this.boMaster());\n      const beo={ id:\"e\"+Date.now().toString(36)+Math.random().toString(36).slice(2,5),\n        name:file.name, beo:p.meta.beo||\"\", date:p.meta.date||\"\", booking:p.meta.booking||\"\",\n        event:p.event, bars:1, pax:p.pax||0, tables:p.tables||0,\n        style:(p.cocktail?\"cocktail\":\"seated\"), hours:(p.consHours||p.defHours||0),\n        blocks:(p.blocks||[]).map(bl=>({ tier:bl.tier, pax:bl.pax, tables:p.tables||0, hours:bl.hours||p.defHours||0, rawName:bl.rawName, wines:bl.wines, bevs:bl.bevs })),\n        explicit:(p.explicit||[]).map(e=>({name:e.name, qty:e.qty, unit:e.unit||\"bottles\"})),\n        manual:(p.manual||[]).map(m=>({name:m.name, unit:m.unit||\"bottles\"})) };\n      const list=(this.state.barOrders||[]).map(b=> b.id===id ? Object.assign({}, b, {beos:(b.beos||[]).concat([beo]), updatedAt:Date.now()}) : b);\n      return new Promise(res=>this.setState({barOrders:list}, ()=>{ this.save({}); res(); }));\n    })), Promise.resolve());\n    run.then(()=>{ this.setState({boBusy:false}); const uid=this.state.owner; if(uid) this.pushBarOrders(uid, this.state.barOrders, this.state.boDeleted); },\n             err=>this.setState({boBusy:false, boErr:(err&&err.message)||\"Couldn\u2019t read that PDF.\"}));\n  }\n  /* Aggregate an order into per-item totals. Returns {items:[{name,qty,unit}], perBeo:[...]}. */\n  boAggregate(bo){\n    const norm=(s)=>String(s||\"\").trim().toLowerCase().replace(/\\s+/g,\" \");\n    const tot={}; const order=[];\n    const add=(name, qty, unit)=>{ const k=norm(name); if(!tot[k]){ tot[k]={name:name, qty:0, unit:unit||\"bottles\"}; order.push(k); } tot[k].qty+=qty; };\n    const master=this.boMaster();\n    (bo.beos||[]).filter(b=>b.submitted).forEach(beo=>{\n      (beo.blocks||[]).forEach(bl=>{\n        this.boCompute(bl, beo, master).forEach(l=>{\n          const unit=/lemon|lime/i.test(l.role)?\"kg\":\"bottles\";\n          add(l.name, l.qty, unit);\n        });\n      });\n      (beo.explicit||[]).forEach(e=> add(e.name, e.qty, e.unit||\"bottles\"));\n      const cons=this.boConsume(beo, master);\n      (beo.manual||[]).forEach((m,i)=>{ const q = (m.ov!=null ? +m.ov : (cons[i]?cons[i].est:0)); if(q) add(m.name, q, m.unit||\"bottles\"); });\n    });\n    const items=order.map(k=>tot[k]).sort((a,b)=>b.qty-a.qty);\n    return { items };\n  }\n  boPatchManual(id, beoIdx, manIdx, patch){\n    const list=(this.state.barOrders||[]).map(b=>{\n      if(b.id!==id) return b;\n      const beos=(b.beos||[]).map((e,i)=>{\n        if(i!==beoIdx) return e;\n        const manual=(e.manual||[]).map((m,k)=> k===manIdx ? Object.assign({}, m, patch) : m);\n        return Object.assign({}, e, {manual:manual});\n      });\n      return Object.assign({}, b, {beos:beos, updatedAt:Date.now()});\n    });\n    this.boSave(list);\n  }\n  downloadBarOrderXlsx(bo){\n    if(!bo) return false;\n    const agg=this.boAggregate(bo);\n    const head=[\"Item\",\"Quantity\",\"Unit\"];\n    const body=agg.items.map(it=>[ it.name, Math.round(it.qty*100)/100, it.unit ]);\n    const specs=[{ name:\"Order Total\", head:head, body:body, totals:null }];\n    // per-BEO breakdown sheet\n    const bhead=[\"BEO\",\"Event / Package\",\"Pax\",\"Item\",\"Quantity\",\"Unit\"];\n    const bbody=[];\n    const master=this.boMaster();\n    (bo.beos||[]).filter(b=>b.submitted).forEach(beo=>{\n      const tag=(beo.beo?(\"#\"+beo.beo):\"\")+(beo.booking?(\" \"+beo.booking):\"\");\n      (beo.blocks||[]).forEach(bl=>{\n        this.boCompute(bl, beo, master).forEach(l=> bbody.push([ tag, bl.rawName||bl.tier, bl.pax||0, l.name, Math.round(l.qty*100)/100, /lemon|lime/i.test(l.role)?\"kg\":\"bottles\" ]));\n      });\n      (beo.explicit||[]).forEach(e=> bbody.push([ tag, \"Listed in BEO\", \"\", e.name, e.qty, e.unit||\"bottles\" ]));\n      const cons=this.boConsume(beo, master);\n      const catLab=this.boCatLabels();\n      (beo.manual||[]).forEach((m,i)=>{ const c=cons[i]||{category:\"\",est:0}; const q=(m.ov!=null?+m.ov:c.est);\n        bbody.push([ tag, \"On consumption (\"+(catLab[c.category]||\"\u2014\")+\")\", beo.pax||\"\", m.name, Math.round(q*100)/100, m.unit||\"bottles\" ]); });\n    });\n    if(bbody.length) specs.push({ name:\"By BEO\", head:bhead, body:bbody, totals:null });\n    const slug=(bo.title||\"bar-order\").trim().toLowerCase().replace(/[^a-z0-9]+/g,\"-\").replace(/^-+|-+$/g,\"\").slice(0,40);\n    const d=new Date();\n    const stamp=d.getFullYear()+\"-\"+String(d.getMonth()+1).padStart(2,\"0\")+\"-\"+String(d.getDate()).padStart(2,\"0\");\n    return this.xlsxFromSpecs(specs, (slug||\"bar-order\")+\"-\"+stamp+\".xlsx\");\n  }\n\n  /* ---------- organisations ----------\n     Everyone in an org has full access to all its stocktakes and past\n     stocktakes. Rows in the shared table: o:<id> (record + members),\n     oc:<CODE> (invite-code -> org), m:<uid> (a user's org), ou:<id> (the org's\n     in-progress stocktakes), oa:<id> (the org's shared past stocktakes). Access\n     is enforced in the app; database-level rules are a later hardening step. */\n  orgKey(id){ return \"o:\"+id; }\n  orgCodeKey(code){ return \"oc:\"+String(code||\"\").toUpperCase(); }\n  memberKey(uid){ return \"m:\"+uid; }\n  orgActiveKey(id){ return \"ou:\"+id; }\n  makeOrgCode(){ const A=\"ACDEFGHJKLMNPQRTUVWXY3479\"; let o=\"\"; for(let i=0;i<6;i++) o+=A[Math.floor(Math.random()*A.length)]; return o; }\n  fetchOrgArchive(orgId){ if(!orgId||!SB.on()) return Promise.resolve([]); return SB.get(\"oa:\"+orgId).then(d=>(d&&d.archive)||[], ()=>[]); }\n  fetchPersonalArchive(uid){ if(!uid||!SB.on()) return Promise.resolve([]); return SB.get(\"a:\"+uid).then(d=>(d&&d.archive)||[], ()=>[]); }\n\n  /* On login: find the user's org (if any), adopt its shared archive, then\n     resume their in-progress stocktake \u2014 in that order so the archive is\n     org-scoped before anything syncs it. */\n  loadOrgThenResume(uid){\n    if(!uid){ this.resumeOwn(uid); return; }\n    if(!SB.on()){ this.resumeOwn(uid); return; }\n    SB.get(this.memberKey(uid)).then(mrec=>{\n      const orgId = (mrec && mrec.orgId) || \"\";\n      if(!orgId){ if(this.state.orgId) this.setState({org:null, orgId:\"\"}, ()=>this.save({})); this.resumeOwn(uid); return; }\n      SB.get(this.orgKey(orgId)).then(org=>{\n        /* The org was disbanded, or this account was removed from it while signed\n           out: drop the stale membership pointer and resume as a personal (no-org)\n           account instead of adopting a dead org. */\n        const removed = org && org.id && Array.isArray(org.members) && !org.members.some(m=>m.uid===uid);\n        if((org && org.deleted) || removed){\n          SB.put(this.memberKey(uid), {orgId:null, ts:Date.now()}).catch(()=>{});\n          this.setState({org:null, orgId:\"\"}, ()=>{ this.save({}); this.resumeOwn(uid); });\n          return;\n        }\n        /* seed the org's live-stocktake list so the home screen can show it right away */\n        SB.get(this.orgActiveKey(orgId)).then(d=>{ this.setState({orgActive:((d&&d.active)||[])}); }, ()=>{});\n        this.fetchOrgArchive(orgId).then(arch=>{\n          this.setState({ org:(org&&org.id)?org:this.state.org, orgId:orgId, archive:arch, followups:[], fuDeleted:[] }, ()=>{ this.save({}); this.resumeOwn(uid); });\n        });\n      }, ()=>this.resumeOwn(uid));\n    }, ()=>this.resumeOwn(uid));\n  }\n\n  createOrg(){\n    const s=this.state; const name=(s.orgNameInput||\"\").trim();\n    if(name.length<2){ this.setState({orgMsg:\"Enter an organisation name.\"}); return; }\n    if(!s.owner){ this.setState({orgMsg:\"Sign in to create an organisation.\"}); return; }\n    const id=\"org\"+Date.now().toString(36)+Math.random().toString(36).slice(2,7);\n    const code=this.makeOrgCode(); const now=Date.now();\n    const org={ id:id, name:name, code:code, adminUid:s.owner, ts:now,\n      members:[{uid:s.owner, name:(s.me||\"\").trim(), ts:now, role:\"admin\"}] };\n    /* If the creator already has a stocktake on the go, register it as the org's\n       first live stocktake so it isn't stranded when the org is created after\n       counting has started. */\n    const mineActive = (s.started && !s.joined && s.code && (s.locNames||[]).length)\n      ? [{code:s.code, title:s.title||\"\", by:s.me||\"\", ts:now}] : [];\n    this.cloudPut(this.orgKey(id), org);\n    this.cloudPut(this.orgCodeKey(code), {orgId:id, ts:now});\n    this.cloudPut(this.memberKey(s.owner), {orgId:id, ts:now});\n    this.cloudPut(this.orgActiveKey(id), {active:mineActive, ts:now});\n    /* Carry the creator's own past stocktakes into the new org so their history\n       isn't hidden. */\n    const seed=(s.archive||[]).slice();\n    this.setState({ org:org, orgId:id, orgActive:mineActive, orgNameInput:\"\", orgMsg:\"\", archive:seed, followups:[], fuDeleted:[] },\n      ()=>{ this.save({}); this.pushArchive(s.owner, seed); });\n  }\n\n  joinOrg(){\n    const s=this.state; const code=(s.orgJoinCode||\"\").trim().toUpperCase();\n    if(code.length<4){ this.setState({orgMsg:\"Enter the organisation code.\"}); return; }\n    if(!s.owner){ this.setState({orgMsg:\"Sign in to join an organisation.\"}); return; }\n    this.setState({orgBusy:true, orgMsg:\"\"});\n    SB.get(this.orgCodeKey(code)).then(rec=>{\n      const orgId = rec && rec.orgId;\n      if(!orgId){ this.setState({orgBusy:false, orgMsg:\"No organisation found for that code.\"}); return; }\n      SB.get(this.orgKey(orgId)).then(org=>{\n        if(!org || !org.id || org.deleted){ this.setState({orgBusy:false, orgMsg:\"That organisation no longer exists.\"}); return; }\n        const members=(org.members||[]).slice();\n        if(!members.some(m=>m.uid===s.owner)) members.push({uid:s.owner, name:(s.me||\"\").trim(), ts:Date.now(), role:\"member\"});\n        const norg=Object.assign({}, org, {members:members});\n        this.cloudPut(this.orgKey(orgId), norg);\n        this.cloudPut(this.memberKey(s.owner), {orgId:orgId, ts:Date.now()});\n        this.fetchOrgArchive(orgId).then(arch=>{\n          this.setState({ org:norg, orgId:orgId, orgActive:[], orgJoinCode:\"\", orgBusy:false, orgMsg:\"\", archive:arch, followups:[], fuDeleted:[] },\n            ()=>{ this.save({}); this.refreshOrg(); });\n        });\n      }, ()=>this.setState({orgBusy:false, orgMsg:\"Couldn't load that organisation.\"}));\n    }, ()=>this.setState({orgBusy:false, orgMsg:\"Couldn't check that code \u2014 try again.\"}));\n  }\n\n  leaveOrg(){\n    const s=this.state; const org=s.org; const uid=s.owner;\n    if(!org){ this.setState({confirm:null}); return; }\n    const members=(org.members||[]).filter(m=>m.uid!==uid);\n    this.cloudPut(this.orgKey(org.id), Object.assign({}, org, {members:members}));\n    if(uid) this.cloudPut(this.memberKey(uid), {orgId:null, ts:Date.now()});\n    /* Back to the account's own past stocktakes (don't drag org history along). */\n    this.fetchPersonalArchive(uid).then(arch=>{\n      this.setState({ org:null, orgId:\"\", orgActive:[], confirm:null, orgMsg:\"\" , archive:arch, followups:[], fuDeleted:[], screen:\"org\" }, ()=>this.save({}));\n    });\n  }\n\n  /* ---- organisation admin (admin-only management) ----\n     The org record (o:<id>) is a shared row every member can read, and only the\n     app gates the controls to admins. Because a member's m:<uid> row is locked to\n     that member by RLS, an admin can't clear someone else's membership directly \u2014\n     instead the admin edits the shared members list (or marks the org deleted),\n     and each affected member's app self-heals on its next refresh (orgSelfRemove). */\n  amAdminOf(org, uid){\n    if(!org || !uid) return false;\n    if(org.adminUid===uid) return true;\n    return (org.members||[]).some(m=>m.uid===uid && m.role===\"admin\");\n  }\n  renameOrg(){\n    const s=this.state, org=s.org; if(!org) return;\n    if(!this.amAdminOf(org, s.owner)){ this.setState({orgMsg:\"Only an admin can rename the organisation.\"}); return; }\n    const name=(s.orgRename||\"\").trim();\n    if(name.length<2){ this.setState({orgMsg:\"Enter an organisation name.\"}); return; }\n    const norg=Object.assign({}, org, {name:name, ts:Date.now()});\n    this.cloudPut(this.orgKey(org.id), norg);\n    this.setState({org:norg, orgRename:\"\", orgMsg:\"Organisation renamed.\"}, ()=>this.save({}));\n  }\n  regenOrgCode(){\n    const s=this.state, org=s.org; if(!org || !this.amAdminOf(org, s.owner)){ this.setState({confirm:null}); return; }\n    const oldCode=org.code, code=this.makeOrgCode(), now=Date.now();\n    const norg=Object.assign({}, org, {code:code, ts:now});\n    this.cloudPut(this.orgKey(org.id), norg);\n    this.cloudPut(this.orgCodeKey(code), {orgId:org.id, ts:now});\n    if(oldCode) this.cloudPut(this.orgCodeKey(oldCode), {orgId:null, ts:now}); // old code no longer joins\n    this.setState({org:norg, confirm:null, orgMsg:\"New invite code generated.\"}, ()=>this.save({}));\n  }\n  removeOrgMember(uid){\n    const s=this.state, org=s.org; if(!org || !uid || !this.amAdminOf(org, s.owner)){ this.setState({confirm:null}); return; }\n    const members=(org.members||[]).filter(m=>m.uid!==uid);\n    const norg=Object.assign({}, org, {members:members, ts:Date.now()});\n    this.cloudPut(this.orgKey(org.id), norg);\n    this.setState({org:norg, confirm:null, pendingOrgUid:\"\", pendingOrgName:\"\", orgMsg:\"Member removed.\"}, ()=>this.save({}));\n  }\n  makeOrgAdmin(uid){\n    const s=this.state, org=s.org; if(!org || !uid || !this.amAdminOf(org, s.owner)){ this.setState({confirm:null}); return; }\n    const members=(org.members||[]).map(m=> m.uid===uid ? Object.assign({}, m, {role:\"admin\"}) : m);\n    const norg=Object.assign({}, org, {members:members, ts:Date.now()});\n    this.cloudPut(this.orgKey(org.id), norg);\n    this.setState({org:norg, confirm:null, pendingOrgUid:\"\", pendingOrgName:\"\", orgMsg:\"Admin added.\"}, ()=>this.save({}));\n  }\n  deleteOrg(){\n    const s=this.state, org=s.org; if(!org || !this.amAdminOf(org, s.owner)){ this.setState({confirm:null}); return; }\n    const now=Date.now();\n    this.cloudPut(this.orgKey(org.id), {id:org.id, name:org.name, deleted:true, ts:now}); // tombstone; members self-heal\n    if(org.code) this.cloudPut(this.orgCodeKey(org.code), {orgId:null, ts:now});\n    this.setState({confirm:null}, ()=>this.orgSelfRemove(\"Organisation deleted.\"));\n  }\n  /* Revert this device to a personal (no-org) state \u2014 used when the admin deletes\n     the org, when this member is removed, or on delete. Clears our own membership\n     pointer (allowed under RLS) and restores the personal archive. */\n  orgSelfRemove(msg){\n    const uid=this.state.owner;\n    if(uid && SB.on()) SB.put(this.memberKey(uid), {orgId:null, ts:Date.now()}).catch(()=>{});\n    const done=(arch)=>this.setState({ org:null, orgId:\"\", orgActive:[], orgRename:\"\", confirm:null, archive:(arch||[]), followups:[], fuDeleted:[], orgMsg: msg||\"\" }, ()=>this.save({}));\n    this.fetchPersonalArchive(uid).then(done, ()=>done(this.state.archive));\n  }\n  /* Like orgSelfRemove, but surfaces a popup so the member actually sees why\n     their org access ended. The admin can remove someone (or disband the org)\n     while that member is mid-count, so a quiet revert isn't enough \u2014 this reverts\n     to a personal (no-org) state AND opens a single-button notice dialog. */\n  orgRemovedNotice(title, note){\n    const uid=this.state.owner;\n    if(uid && SB.on()) SB.put(this.memberKey(uid), {orgId:null, ts:Date.now()}).catch(()=>{});\n    const dlg={kind:\"orgKicked\", title:title, note:note, label:\"OK\", cancel:\"\"};\n    const done=(arch)=>this.setState({ org:null, orgId:\"\", orgActive:[], orgRename:\"\", archive:(arch||[]), followups:[], fuDeleted:[], orgMsg:\"\", confirm:dlg }, ()=>this.save({}));\n    this.fetchPersonalArchive(uid).then(done, ()=>done(this.state.archive));\n  }\n\n  openOrg(){ this.setState({screen:\"org\", orgMsg:\"\"}, ()=>this.refreshOrg()); }\n  /* Pull the org's record, live stocktakes and shared archive. Only writes to\n     state (or the cloud) when something actually changed, so it's safe to call on\n     a timer while the Organisation page is open (see maybeRefreshOrg). */\n  refreshOrg(){\n    const id=this.state.orgId; if(!id || !SB.on()) return;\n    SB.get(this.orgKey(id)).then(org=>{\n      const uid=this.state.owner;\n      /* The admin disbanded the org, or removed me from it: revert to a personal\n         (no-org) state. Only act on a definite signal (deleted flag, or a valid\n         members list that excludes me) \u2014 never on a transient empty read. */\n      if(org && org.deleted){ this.orgRemovedNotice(\"Organisation disbanded\", \"The organisation \"+((org.name)||\"you were in\")+\" was disbanded by its admin. You've been moved back to your own stocktakes.\"); return; }\n      if(org && org.id && Array.isArray(org.members) && uid && !org.members.some(m=>m.uid===uid)){ this.orgRemovedNotice(\"Removed from organisation\", \"An admin removed you from \"+((org.name)||\"the organisation\")+\". You've been moved back to your own stocktakes \u2014 you can re-join any time with the invite code.\"); return; }\n      if(org && org.id && JSON.stringify(org)!==JSON.stringify(this.state.org)) this.setState({org:org}, ()=>this.save({}));\n    }, ()=>{});\n    /* Make sure this member's own in-progress stocktake is registered \u2014 covers\n       one started before the org existed, so it isn't missing from the live list. */\n    this.orgRegisterActive();\n    SB.get(this.orgActiveKey(id)).then(d=>{\n      let list=((d&&d.active)||[]).slice();\n      const s=this.state;\n      if(s.orgId===id && s.started && !s.joined && s.code && (s.locNames||[]).length && !list.some(x=>x.code===s.code)){\n        list.push({code:s.code, title:s.title||\"\", by:s.me||\"\", ts:Date.now()});\n      }\n      if(JSON.stringify(list)!==JSON.stringify(this.state.orgActive||[])) this.setState({orgActive:list});\n    }, ()=>{});\n    this.fetchOrgArchive(id).then(arch=>{ if(JSON.stringify(arch)!==JSON.stringify(this.state.archive||[])) this.setState({archive:arch}, ()=>this.save({})); });\n  }\n  /* Keep the Organisation page live while it's open, the same way counts and past\n     stocktakes stay current (see the interval in componentDidMount). */\n  maybeRefreshOrg(){\n    const s=this.state;\n    if(!SB.on() || !s.ready || !s.orgId || s.joined) return;\n    if(s.screen===\"org\" || s.screen===\"hub\"){ this.refreshOrg(); return; } // full refresh on the org page and home screen\n    this.checkOrgMembership(); // on every other screen (e.g. mid-count) still watch for being removed / disbanded\n  }\n  /* Lightweight watch used away from the Organisation page (e.g. while a member\n     is counting): just detect being removed or the org being disbanded and pop a\n     notice, without the extra archive/live-list reads the full refreshOrg does.\n     Only acts on a definite signal, never on a transient empty read. */\n  checkOrgMembership(){\n    const id=this.state.orgId; if(!id || !SB.on()) return;\n    if(this.state.confirm && this.state.confirm.kind===\"orgKicked\") return; // notice already up\n    SB.get(this.orgKey(id)).then(org=>{\n      const uid=this.state.owner;\n      if(org && org.deleted){ this.orgRemovedNotice(\"Organisation disbanded\", \"The organisation \"+((org.name)||\"you were in\")+\" was disbanded by its admin. You've been moved back to your own stocktakes.\"); return; }\n      if(org && org.id && Array.isArray(org.members) && uid && !org.members.some(m=>m.uid===uid)){ this.orgRemovedNotice(\"Removed from organisation\", \"An admin removed you from \"+((org.name)||\"the organisation\")+\". You've been moved back to your own stocktakes \u2014 you can re-join any time with the invite code.\"); return; }\n    }, ()=>{});\n  }\n\n  /* An org's in-progress stocktakes live in ou:<id>. Registered when a member\n     starts counting (or opens the org while already counting), removed when it's\n     closed or cancelled, so every member can see and open what's live across the\n     org. Counters (joined) don't own a stocktake, so they never register one.\n     Skips the cloud write when this stocktake is already listed unchanged, so it\n     can run on the org-page refresh timer without churning the row. */\n  orgRegisterActive(){\n    const s=this.state; if(!s.orgId || !s.started || s.joined || !s.code || !(s.locNames||[]).length || !SB.on()) return;\n    const key=this.orgActiveKey(s.orgId);\n    const entry={code:s.code, title:s.title||\"\", by:s.me||\"\", ts:Date.now()};\n    SB.get(key).then(d=>{\n      const cur=((d&&d.active)||[]);\n      const same=cur.find(x=>x.code===s.code);\n      if(same && same.title===entry.title && same.by===entry.by) return; // already listed unchanged\n      const list=cur.filter(x=>x.code!==s.code); list.push(entry);\n      SB.put(key, {active:list, ts:Date.now()}).catch(()=>{});\n    }, ()=>{ SB.put(key, {active:[entry], ts:Date.now()}).catch(()=>{}); });\n  }\n  orgUnregisterActive(orgId, code){\n    if(!orgId || !code || !SB.on()) return;\n    const key=this.orgActiveKey(orgId);\n    SB.get(key).then(d=>{ const list=((d&&d.active)||[]).filter(x=>x.code!==code); SB.put(key, {active:list, ts:Date.now()}).catch(()=>{}); }, ()=>{});\n  }\n  /* Open one of the org's live stocktakes as this member's current one \u2014 full\n     access, so they can count on it alongside whoever else is in it. */\n  openOrgStk(code){\n    if(!code){ return; }\n    this.fetchDoc(code).then(doc=>{\n      if(!doc || !(doc.locNames||[]).length){ this.setState({orgMsg:\"That stocktake is empty or was removed.\"}); return; }\n      if(!this.cache) this.cache={};\n      this.cache[code]=doc;\n      this.setState({\n        code:code, started:true, joined:false, viewAs:\"admin\",\n        title:doc.title||\"\", locNames:doc.locNames||[], master:doc.master||[],\n        counts:doc.counts||{}, submitted:doc.submitted||{}, subAt:doc.subAt||{}, dup:doc.dup||{}, dupCleared:doc.dupCleared||{}, resetAt:doc.resetAt||0,\n        hidden:doc.hidden||{}, hideEmpty:doc.hideEmpty||{}, admin:doc.admin||this.state.me,\n        menuOpen:false, orgMsg:\"\", screen:\"home\", stkFrom:\"org\"\n      }, ()=>{ this.save({}); if(this.state.owner) this. ---- */\n    if(s.screen===\"bo\" || s.screen===\"boView\" || s.screen===\"boTotals\"){\n      vals.boBack = ()=>this.goHubNav();\n      const TIER = this.boTierOptions();\n      const EV = this.boEventOptions();\n      const chip = (label, active, onPick)=>({ label:label,\n        bg: active?\"var(--primary)\":\"var(--surface)\", border: active?\"var(--primary)\":\"var(--line)\",\n        ink: active?\"var(--on-primary)\":\"var(--ink-2)\", pick:onPick });\n\n      if(s.screen===\"bo\"){\n        const list = (s.barOrders||[]).slice().sort((a,b)=>((b.ts||0)-(a.ts||0)));\n        vals.boEmpty = list.length===0;\n        vals.boNew = ()=>this.boNew();\n        vals.boList = list.map(o=>{\n          const n=(o.beos||[]).length; const agg=this.boAggregate(o);\n          return { id:o.id, title:o.title||\"Bar order\",\n            meta: n+(n===1?\" BEO\":\" BEOs\")+\" \u00b7 \"+agg.items.length+(agg.items.length===1?\" item\":\" items\"),\n            open: ()=>this.setState({screen:\"boView\", boView:o.id, boErr:\"\"}),\n            del: ()=>this.setState({ pendingDelete:o.id, confirm:{ kind:\"deleteBarOrder\",\n              title:\"Delete this bar order?\", note:\"\u201c\"+(o.title||\"This order\")+\"\u201d and its uploaded BEOs will be removed from this device.\",\n              label:\"Delete\", cancel:\"Keep it\" } }) };\n        });\n      }\n\n      if(s.screen===\"boView\"){\n        const bo = (s.barOrders||[]).find(b=>b.id===s.boView);\n        if(!bo){ vals.boGone=true; vals.boHere=false; vals.boViewBack=()=>this.setState({screen:\"bo\", boView:null}); }\n        else {\n          vals.boHere=true; vals.boGone=false;\n          vals.boTitle = bo.title||\"\";\n          vals.onBoTitle = (e)=>this.boPatch(bo.id, {title:e.target.value});\n          vals.boViewBack = ()=>this.setState({screen:\"bo\", boView:null});\n          vals.boBusy = !!s.boBusy; vals.boErr = s.boErr||\"\"; vals.boHasErr = !!(s.boErr||\"\").length;\n          vals.onBoFiles = (e)=>{ this.boAddFiles(e.target.files); try{ e.target.value=\"\"; }catch(_){} };\n          vals.boDel = ()=>this.setState({ pendingDelete:bo.id, confirm:{ kind:\"deleteBarOrder\",\n            title:\"Delete this bar order?\", note:\"\u201c\"+(bo.title||\"This order\")+\"\u201d and its uploaded BEOs will be removed from this device.\",\n            label:\"Delete\", cancel:\"Keep it\" } });\n          vals.boExport = ()=>this.downloadBarOrderXlsx(bo);\n          const boMaster = this.boMaster();\n          const catLab = this.boCatLabels();\n\n          vals.boBeos = (bo.beos||[]).map((beo,bi)=>{\n            const evChips = EV.map(o=>chip(o.label, beo.event===o.key, ()=>this.boPatchBeo(bo.id,bi,{event:o.key})));\n            const blocks = (beo.blocks||[]).map((bl,ki)=>{\n              const isCk = bl.tier===\"cocktail\";\n              const tChips = TIER.map(o=>chip(o.label, bl.tier===o.key, ()=>this.boPatchBlock(bo.id,bi,ki,{tier:o.key})));\n              const lines = this.boCompute(bl, beo, boMaster).map(l=>({ role:l.role, qty:this.fmt(Math.round(l.qty*100)/100), name:l.name }));\n              return { title: bl.rawName || (TIER.filter(t=>t.key===bl.tier)[0]||{label:\"Package\"}).label,\n                tierChips:tChips, isCocktail:isCk,\n                pax:String(bl.pax||0), onPax:(e)=>this.boPatchBlock(bo.id,bi,ki,{pax:parseFloat(e.target.value)||0}),\n                tablesDerived:String(this.boTables(bl.pax)),\n                hours:String(bl.hours||0), onHours:(e)=>this.boPatchBlock(bo.id,bi,ki,{hours:parseFloat(e.target.value)||0}),\n                lines:lines };\n            });\n            const explicit = (beo.explicit||[]).map(e=>({ name:e.name, qty:this.fmt(e.qty), unit:e.unit||\"bottles\" }));\n            const cons = this.boConsume(beo, boMaster);\n            const manual = (beo.manual||[]).map((m,mi)=>{\n              const c = cons[mi] || {category:\"\", est:0};\n              const est = Math.round(c.est*100)/100;\n              return { name:m.name, unit:m.unit||\"bottles\", cat: catLab[c.category]||\"\u2014\",\n                qtyVal: String(m.ov!=null ? m.ov : est),\n                onQty:(e)=>this.boPatchManual(bo.id,bi,mi,{ ov: (e.target.value===\"\"? null : (parseFloat(e.target.value)||0)) }) };\n            });\n            return { title: (beo.beo?(\"#\"+beo.beo+\" \"):\"\")+(beo.booking||beo.name||\"BEO\"),\n              sub: [beo.date, beo.name].filter(Boolean).join(\" \u00b7 \"),\n              submitted: !!beo.submitted, notSubmitted: !beo.submitted,\n              submit: ()=>this.boPatchBeo(bo.id,bi,{submitted:true}),\n              reopen: ()=>this.boPatchBeo(bo.id,bi,{submitted:false}),\n              hasManual0:(beo.manual||[]).length>0,\n              paxVal:String(beo.pax||0), onPax:(e)=>this.boPatchBeo(bo.id,bi,{pax:parseFloat(e.target.value)||0}),\n              tablesDerived:String(this.boTables(beo.pax)),\n              isCocktailStyle: beo.style===\"cocktail\", notCocktailStyle: beo.style!==\"cocktail\",\n              styleChips: [ chip(\"Seated\", beo.style!==\"cocktail\", ()=>this.boPatchBeo(bo.id,bi,{style:\"seated\"})),\n                            chip(\"Cocktail\", beo.style===\"cocktail\", ()=>this.boPatchBeo(bo.id,bi,{style:\"cocktail\"})) ],\n              hoursVal:String(beo.hours||0), onHours:(e)=>this.boPatchBeo(bo.id,bi,{hours:parseFloat(e.target.value)||0}),\n              barsVal:String(beo.bars||0), onBars:(e)=>this.boPatchBeo(bo.id,bi,{bars:parseFloat(e.target.value)||0}),\n              eventChips:evChips, blocks:blocks, explicit:explicit, manual:manual,\n              hasBlocks:blocks.length>0, hasExplicit:explicit.length>0, hasManual:manual.length>0,\n              nothing: blocks.length===0 && explicit.length===0 && manual.length===0,\n              remove: ()=>this.boRemoveBeo(bo.id,bi) };\n          });\n          vals.boBeosEmpty = (bo.beos||[]).length===0;\n          const subCount = (bo.beos||[]).filter(b=>b.submitted).length;\n          const total = (bo.beos||
