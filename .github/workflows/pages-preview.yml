name: Preview to GitHub Pages

# Publishes the built app in project/deploy to GitHub Pages as a free preview
# site. Triggers on pushes to the working branch (not main), so previews update
# without touching the Netlify production deploy. Netlify still handles main.
on:
  push:
    branches:
      - claude/eager-hawking-f7jnne
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One preview at a time; a newer push supersedes an in-flight one.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Upload built app
        uses: actions/upload-pages-artifact@v3
        with:
          path: project/deploy
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
