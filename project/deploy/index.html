document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);

    // events at the element — warn only; real JS errors carry message/error.

      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));

    let template = JSON.parse(templateEl.textContent);

    // document's manifest; frame srcs carry an about:blank#<uuid> marker

    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).

    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin

    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https

    // opaque contexts — file:// — everything serializes as 'null', where

    // deny-by-default: one request form, one reply form, no error
    // replies.

    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document

      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.

    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;

    window.addEventListener('message', function (e) {

      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss

          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }

        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;

      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];

            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();

            writer.close();

            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;

            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }

            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }

          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {

            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);

        console.error('Failed to decode asset ' + uuid + ':', err);

        resourceBlobs[blobUrls[uuid]] = blob;
      }

    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

an be sorted out later.<\u002Fp>\n<input value=\"{{ meValue }}\" onChange=\"{{ onMe }}\" placeholder=\"Your name\" style=\"margin-top:10px;width:100%;padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);outline:none;font:400 13px/1 'Public Sans',sans-serif;color:var(--ink)\" />\n<div style=\"margin-top:10px;padding:13px 14px;background:var(--surface-2);border-radius:11px;display:flex;align-items:center;gap:12px;box-shadow:var(--inset-shadow)\">\n<span style=\"flex:1;min-width:0\">\n<span style=\"display:block;font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">JOIN CODE FOR YOUR TEAM<\u002Fspan>\n<span style=\"display:block;margin-top:7px;font:700 22px/1 'Public Sans',sans-serif;letter-spacing:.22em;color:var(--ink)\">{{ joinCode }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex:none;font:400 10px/1.4 'Public Sans',sans-serif;color:var(--ink-3);text-align:right;max-width:110px\">Others type this on their phone to count with you<\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;gap:7px\">\n<input value=\"{{ joinCodeValue }}\" onChange=\"{{ onJoinCode }}\" placeholder=\"Or join a code\" style=\"flex:1;min-width:0;padding:12px;border:1px solid var(--line);border-radius:11px;background:var(--surface);outline:none;font:500 13px/1 'Public Sans',sans-serif;letter-spacing:.14em;color:var(--ink)\" />\n<button onClick=\"{{ tryJoin }}\" style=\"flex:none;padding:0 15px;border-radius:11px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink-2);box-shadow:var(--card-shadow)\">JOIN<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ joinNote }}\" hint-placeholder-val=\"{{ false }}\">\n<p style=\"margin:9px 2px 0;font:400 11px/1.5 'Public Sans',sans-serif;color:var(--ink);text-wrap:pretty\">{{ joinNote }}<\u002Fp>\n<\u002Fsc-if>\n<\u002Fdiv>\n\n<div>\n<div style=\"display:flex;align-items:center;gap:9px\">\n<span style=\"width:20px;height:20px;flex:none;border-radius:6px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font:600 10px/1 'Public Sans',sans-serif\">3<\u002Fspan>\n<span style=\"flex:1;font:500 10px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-2)\">LOCATIONS TO COUNT<\u002Fspan>\n<span style=\"font:400 10px/1 'Public Sans',sans-serif;color:var(--ink-3)\">{{ setupLocsCount }}<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:9px 0 0;font:400 11.5px/1.5 'Public Sans',sans-serif;color:var(--ink-3);text-wrap:pretty\">Bars, venues, fridges, storerooms \u2014 your names, your order.<\u002Fp>\n<div style=\"margin-top:10px;display:flex;gap:7px\">\n<input value=\"{{ newLoc }}\" onChange=\"{{ onNewLoc }}\" placeholder=\"Add a location\" style=\"flex:1;min-width:0;padding:13px;border:1px solid var(--line);border-radius:11px;background:var(--surface);outline:none;font:400 13px/1 'Public Sans',sans-serif;color:var(--ink)\" />\n<button onClick=\"{{ addLoc }}\" style=\"flex:none;padding:0 15px;border-radius:11px;background:{{ addLocBg }};border:none;cursor:pointer;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--on-primary)\">{{ addLocLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:7px\">\n<sc-for list=\"{{ setupLocs }}\" as=\"sl\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;align-items:center;gap:9px;padding:9px 11px;background:var(--surface);border:1px solid var(--line);border-radius:11px;box-shadow:var(--card-shadow)\">\n<span style=\"width:30px;height:30px;flex:none;border-radius:9px;background:{{ sl.tint }};display:flex;align-items:center;justify-content:center;font:600 10px/1 'Public Sans',sans-serif;color:{{ sl.tintInk }}\">{{ sl.abbr }}<\u002Fspan>\n<input value=\"{{ sl.name }}\" onChange=\"{{ sl.rename }}\" style=\"flex:1;min-width:0;border:none;outline:none;background:transparent;font:500 12.5px/1.2 'Public Sans',sans-serif;color:var(--ink)\" />\n<button onClick=\"{{ sl.remove }}\" style=\"flex:none;padding:6px 9px;border:1px solid var(--primary);background:var(--surface);border-radius:7px;cursor:pointer;font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink)\">REMOVE<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div>\n<div style=\"display:flex;align-items:center;gap:9px\">\n<span style=\"width:20px;height:20px;flex:none;border-radius:6px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font:600 10px/1 'Public Sans',sans-serif\">4<\u002Fspan>\n<span style=\"flex:1;font:500 10px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-2)\">PRODUCT LIST<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:9px 0 0;font:400 11.5px/1.5 'Public Sans',sans-serif;color:var(--ink-3);text-wrap:pretty\">{{ setupMasterCount }}. Every location counts this same list.<\u002Fp>\n<div style=\"margin-top:10px;display:flex;gap:7px\">\n<button onClick=\"{{ openAdd }}\" style=\"flex:1;padding:12px;border-radius:11px;background:var(--primary);border:none;cursor:pointer;font:600 10.5px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--on-primary)\">+ ADD PRODUCT<\u002Fbutton>\n<button onClick=\"{{ openImport }}\" style=\"flex:1;padding:12px;border-radius:11px;background:var(--surface);border:1px solid var(--line);cursor:pointer;font:600 10.5px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink-2);box-shadow:var(--card-shadow)\">ATTACH EXCEL<\u002Fbutton>\n<\u002Fdiv>\n<button onClick=\"{{ openMaster }}\" style=\"margin-top:7px;width:100%;padding:11px;border-radius:11px;background:transparent;border:1px solid var(--line);cursor:pointer;font:500 10.5px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink-2)\">REVIEW THE LIST<\u002Fbutton>\n<\u002Fdiv>\n\n<sc-if value=\"{{ driveEnabled }}\" hint-placeholder-val=\"{{ false }}\">\n<div>\n<div style=\"display:flex;align-items:center;gap:9px\">\n<span style=\"width:20px;height:20px;flex:none;border-radius:6px;background:var(--primary);color:var(--on-primary);display:flex;align-items:center;justify-content:center;font:600 10px/1 'Public Sans',sans-serif\">5<\u002Fspan>\n<span style=\"flex:1;font:500 10px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-2)\">WHERE IT SAVES<\u002Fspan>\n<\u002Fdiv>\n<p style=\"margin:9px 0 0;font:400 11.5px/1.5 'Public Sans',sans-serif;color:var(--ink-3);text-wrap:pretty\">Counting happens on the shared stocktake, so everyone's lines arrive as they go. Drive is where the finished count is filed at the end, for whoever needs it after.<\u002Fp>\n<sc-if value=\"{{ driveOff }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:10px;padding:14px;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px\">\n<div style=\"font:600 12.5px/1.3 'Public Sans',sans-serif;color:var(--ink)\">No Drive account yet<\u002Fdiv>\n<p style=\"margin:7px 0 0;font:400 11px/1.5 'Public Sans',sans-serif;color:var(--ink-3);text-wrap:pretty\">Counting still works without it. You just have no copy filed anywhere afterwards, so the finished numbers stay inside the app.<\u002Fp>\n<button onClick=\"{{ connectDrive }}\" style=\"margin-top:11px;width:100%;padding:13px;border-radius:11px;background:var(--primary);border:none;cursor:pointer;font:600 12.5px/1 'Public Sans',sans-serif;color:var(--on-primary)\" style-hover=\"background:var(--line)\">Connect Google Drive<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ driveOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:10px;padding:14px;background:var(--surface-2);border-radius:12px;box-shadow:var(--inset-shadow)\">\n<div style=\"display:flex;align-items:center;gap:8px\">\n<span style=\"width:6px;height:6px;border-radius:50%;background:var(--ok)\"><\u002Fspan>\n<span style=\"flex:1;font:400 10px/1 'Public Sans',sans-serif;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ driveAccount }}<\u002Fspan>\n<button onClick=\"{{ disconnectDrive }}\" style=\"flex:none;padding:8px 11px;background:var(--surface-3);border:1px solid var(--line);border-radius:8px;cursor:pointer;font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.08em;color:var(--ink-3);box-shadow:var(--inset-shadow)\">CHANGE<\u002Fbutton>\n<\u002Fdiv>\n<div style=\"margin-top:11px;font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">FINISHED COUNT SAVES AS<\u002Fdiv>\n<div style=\"margin-top:8px;font:600 12.5px/1.3 'Public Sans',sans-serif;color:var(--ink);word-break:break-all\">{{ driveFileName }}<\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;align-items:center;gap:7px\">\n<span style=\"font:400 10px/1 'Public Sans',sans-serif;color:var(--ink-3)\">in<\u002Fspan>\n<input value=\"{{ folderValue }}\" onChange=\"{{ onFolder }}\" placeholder=\"Folder\" style=\"flex:1;min-width:0;padding:14px 10px;border:1px solid var(--line);border-radius:9px;background:var(--surface-3);outline:none;font:400 11px/1 'Public Sans',sans-serif;color:var(--ink);box-shadow:var(--inset-shadow)\" />\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"margin-top:8px;padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card-shadow)\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">WHO CAN OPEN IT<\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;flex-direction:column;gap:6px\">\n<sc-for list=\"{{ driveShared }}\" as=\"ds2\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;align-items:center;gap:9px;padding:8px 10px;background:var(--surface-3);border:1px solid var(--surface-3);border-radius:9px;box-shadow:var(--inset-shadow)\">\n<span style=\"width:22px;height:22px;flex:none;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;font:600 10px/1 'Public Sans',sans-serif;color:var(--surface)\">{{ ds2.initial }}<\u002Fspan>\n<span style=\"flex:1;min-width:0;font:400 11px/1 'Public Sans',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ ds2.email }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:8px;display:flex;gap:7px\">\n<input value=\"{{ shareInput }}\" onChange=\"{{ onShareInput }}\" placeholder=\"name@gmail.com\" style=\"flex:1;min-width:0;padding:14px 11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-3);outline:none;font:400 11.5px/1 'Public Sans',sans-serif;color:var(--ink);box-shadow:var(--inset-shadow)\" />\n<button onClick=\"{{ addShare }}\" style=\"flex:none;min-height:44px;padding:0 14px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;font:600 9.5px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink);box-shadow:var(--inset-shadow)\">SHARE<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<button onClick=\"{{ startCounting }}\" style=\"width:100%;padding:16px;border-radius:12px;background:{{ startBg }};border:none;cursor:pointer;font:600 14px/1 'Public Sans',sans-serif;color:var(--on-primary)\">{{ startLabel }}<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ isDrive }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"height:100%;display:flex;flex-direction:column\">\n<div style=\"padding:12px 16px 14px;background:var(--bg);border-bottom:1px solid var(--line)\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<button onClick=\"{{ goHome }}\" style=\"width:32px;height:32px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font:400 15px/1 'Public Sans',sans-serif;color:var(--ink)\">\u2039<\u002Fbutton>\n<div style=\"flex:1;min-width:0\">\n<div style=\"font:600 15px/1.1 'Public Sans',sans-serif;color:var(--ink)\">Google Drive<\u002Fdiv>\n<div style=\"margin-top:3px;font:400 10px/1 'Public Sans',sans-serif;color:var(--ink-3)\">{{ driveAccount }}<\u002Fdiv>\n<\u002Fdiv>\n<button onClick=\"{{ toggleOnline }}\" style=\"flex:none;display:flex;align-items:center;gap:6px;padding:7px 10px;background:var(--surface);border:1px solid var(--line);border-radius:999px;cursor:pointer\">\n<span style=\"width:6px;height:6px;border-radius:50%;background:{{ onlineDot }}\"><\u002Fspan>\n<span style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink-2)\">{{ onlineLabel }}<\u002Fspan>\n<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"flex:1;overflow:auto;padding:16px 16px 44px;display:flex;flex-direction:column;gap:14px\">\n\n<sc-if value=\"{{ driveOff }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"padding:18px 16px;background:var(--surface);border:1px dashed var(--line-2);border-radius:14px\">\n<div style=\"font:600 13.5px/1.3 'Public Sans',sans-serif;color:var(--ink)\">Not connected<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 11.5px/1.6 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">Nothing is being filed to Drive. Counting and sharing work regardless \u2014 connect an account and the finished stocktake is written to a folder your team can open, updated as locations are submitted.<\u002Fp>\n<button onClick=\"{{ connectDrive }}\" style=\"margin-top:12px;width:100%;padding:14px;border-radius:12px;background:var(--primary);border:none;cursor:pointer;font:600 13px/1 'Public Sans',sans-serif;color:var(--on-primary)\">Connect Google Drive<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<sc-if value=\"{{ driveOn }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"padding:14px;background:var(--surface-2);border-radius:14px;box-shadow:var(--inset-shadow)\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">SHARED FILE<\u002Fdiv>\n<div style=\"margin-top:9px;font:600 13px/1.3 'Public Sans',sans-serif;color:var(--ink);word-break:break-all\">{{ driveFileName }}<\u002Fdiv>\n<div style=\"margin-top:6px;font:400 10.5px/1 'Public Sans',sans-serif;color:var(--ink-3)\">in {{ driveFolder }} \u00b7 {{ driveSharedCount }}<\u002Fdiv>\n<div style=\"margin-top:14px;display:flex;gap:18px\">\n<div><div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.1em;color:var(--ink-3)\">LAST SYNC<\u002Fdiv><div style=\"margin-top:5px;font:500 13px/1 'Public Sans',sans-serif;color:var(--ink)\">{{ lastSyncLabel }}<\u002Fdiv><\u002Fdiv>\n<div><div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.1em;color:var(--ink-3)\">QUEUED<\u002Fdiv><div style=\"margin-top:5px;font:500 13px/1 'Public Sans',sans-serif;color:{{ pendingInk }}\">{{ pendingCount }}<\u002Fdiv><\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<button onClick=\"{{ syncNow }}\" style=\"width:100%;padding:14px;border-radius:12px;background:{{ syncBg }};border:none;cursor:pointer;font:600 13px/1 'Public Sans',sans-serif;color:var(--on-primary)\">{{ syncLabel }}<\u002Fbutton>\n\n<div style=\"padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--card-shadow)\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">WHO CAN OPEN IT<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 11.5px/1.55 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">Share the file with each counter's own Google account. Everyone stays signed into their own \u2014 that is what puts a real name against each line.<\u002Fp>\n<div style=\"margin-top:11px;display:flex;flex-direction:column;gap:7px\">\n<sc-for list=\"{{ driveShared }}\" as=\"ds\" hint-placeholder-count=\"0\">\n<div style=\"display:flex;align-items:center;gap:10px;padding:9px 11px;background:var(--surface-3);border:1px solid var(--surface-3);border-radius:10px;box-shadow:var(--inset-shadow)\">\n<span style=\"width:26px;height:26px;flex:none;border-radius:50%;background:var(--line-2);display:flex;align-items:center;justify-content:center;font:600 11px/1 'Public Sans',sans-serif;color:var(--surface)\">{{ ds.initial }}<\u002Fspan>\n<span style=\"flex:1;min-width:0;font:400 11.5px/1.2 'Public Sans',sans-serif;color:var(--ink);word-break:break-all\">{{ ds.email }}<\u002Fspan>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<div style=\"margin-top:8px;display:flex;gap:7px\">\n<input value=\"{{ shareInput }}\" onChange=\"{{ onShareInput }}\" placeholder=\"name@gmail.com\" style=\"flex:1;min-width:0;padding:11px;border:1px solid var(--line);border-radius:10px;background:var(--surface-3);outline:none;font:400 12px/1 'Public Sans',sans-serif;color:var(--ink);box-shadow:var(--inset-shadow)\" />\n<button onClick=\"{{ addShare }}\" style=\"flex:none;padding:0 14px;border-radius:10px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink);box-shadow:var(--inset-shadow)\">SHARE<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fdiv>\n\n<div style=\"padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--card-shadow)\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">HOW IT SYNCS<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 11.5px/1.6 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">Each phone appends only its own lines, so two people counting at once never overwrite each other. The app reads the file back and takes the latest entry per product per location \u2014 and when the same line has two names against it, both are kept until someone picks. Off signal, entries queue here and go up when you are back.<\u002Fp>\n<button onClick=\"{{ disconnectDrive }}\" style=\"margin-top:11px;width:100%;padding:11px;border-radius:10px;background:transparent;border:1px solid var(--primary);cursor:pointer;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.06em;color:var(--ink)\">DISCONNECT<\u002Fbutton>\n<\u002Fdiv>\n\n<button onClick=\"{{ openPast }}\" style=\"width:100%;display:flex;align-items:center;gap:12px;padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif;box-shadow:var(--card-shadow)\" style-hover=\"border-color:var(--line-2)\">\n<span style=\"width:32px;height:32px;flex:none;border-radius:9px;background:var(--surface);display:flex;align-items:center;justify-content:center;font:600 12px/1 'Public Sans',sans-serif;color:var(--ink-2)\">{{ pastCount }}<\u002Fspan>\n<span style=\"flex:1;min-width:0\">\n<span style=\"display:block;font:600 13.5px/1.2 'Public Sans',sans-serif;color:var(--ink)\">Past stocktakes<\u002Fspan>\n<span style=\"display:block;margin-top:4px;font:400 10.5px/1 'Public Sans',sans-serif;color:var(--ink-3)\">{{ pastRowMeta }}<\u002Fspan>\n<\u002Fspan>\n<span style=\"flex:none;font:400 15px/1 'Public Sans',sans-serif;color:var(--ink)\">\u203a<\u002Fspan>\n<\u002Fbutton>\n\n<div style=\"padding:14px;background:var(--surface);border:1px solid var(--line);border-radius:13px;box-shadow:var(--card-shadow)\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">WHEN THE COUNT IS DONE<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 11.5px/1.6 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">Closing it off leaves the file in Drive to open any time, and clears the phone for the next count. The locations and product list stay.<\u002Fp>\n<button onClick=\"{{ openFinish }}\" style=\"margin-top:11px;width:100%;min-height:44px;padding:12px;border-radius:11px;background:var(--primary);border:none;cursor:pointer;font:600 12.5px/1 'Public Sans',sans-serif;color:var(--on-primary)\">Finish this stocktake<\u002Fbutton>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<div style=\"padding:13px 14px;background:var(--surface);border:1px dashed var(--line-2);border-radius:12px\">\n<div style=\"font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.12em;color:var(--ink-3)\">PROTOTYPE ONLY<\u002Fdiv>\n<p style=\"margin:8px 0 0;font:400 11.5px/1.55 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">No real Google sign-in is wired up yet. These screens show the states the live app needs \u2014 connected, queued, synced \u2014 so the flow can be judged before the account setup is done.<\u002Fp>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<template id=\"__bundler_thumbnail\">\n<svg viewBox=\"0 0 240 240\" xmlns=\"http://www.w3.org/2000/svg\"><rect width=\"240\" height=\"240\" fill=\"#202024\"><\u002Frect><rect x=\"72\" y=\"66\" width=\"96\" height=\"108\" rx=\"10\" fill=\"#000000\"><\u002Frect><rect x=\"88\" y=\"88\" width=\"44\" height=\"8\" rx=\"4\" fill=\"#3A3A3C\"><\u002Frect><rect x=\"88\" y=\"110\" width=\"64\" height=\"8\" rx=\"4\" fill=\"#3A3A3C\"><\u002Frect><rect x=\"88\" y=\"132\" width=\"34\" height=\"8\" rx=\"4\" fill=\"#FFFFFF\"><\u002Frect><\u002Fsvg>\n<\u002Ftemplate>\n\n<sc-if value=\"{{ isPast }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"height:100%;display:flex;flex-direction:column\">\n<div style=\"padding:12px 16px 14px;background:var(--bg);border-bottom:1px solid var(--line)\">\n<div style=\"display:flex;align-items:center;gap:10px\">\n<button onClick=\"{{ pastBack }}\" style=\"width:32px;height:32px;flex:none;border:1px solid var(--line);background:var(--surface);border-radius:9px;cursor:pointer;font:400 15px/1 'Public Sans',sans-serif;color:var(--ink)\">\u2039<\u002Fbutton>\n<div style=\"flex:1;min-width:0\">\n<div style=\"font:600 15px/1.1 'Public Sans',sans-serif;color:var(--ink)\">Past stocktakes<\u002Fdiv>\n<div style=\"margin-top:3px;font:400 10px/1 'Public Sans',sans-serif;color:var(--ink-3)\">{{ pastRowMeta }}<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:auto;padding:16px 16px 44px;display:flex;flex-direction:column;gap:9px\">\n<sc-if value=\"{{ pastEmpty }}\" hint-placeholder-val=\"{{ true }}\">\n<div s -shadow)\">\u2715<\u002Fbutton>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"margin-top:10px;display:flex;gap:6px;overflow-x:auto;padding-bottom:2px\">\n<sc-for list=\"{{ discLocChips }}\" as=\"lc\" hint-placeholder-count=\"3\">\n<button onClick=\"{{ lc.pick }}\" style=\"flex:none;padding:7px 12px;border-radius:999px;background:{{ lc.bg }};border:1px solid {{ lc.border }};cursor:pointer;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.02em;color:{{ lc.ink }};white-space:nowrap\">{{ lc.name }}<\u002Fbutton>\n<\u002Fsc-for>\n<\u002Fdiv>\n<sc-if value=\"{{ discInLoc }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:9px;font:600 10px/1 'Public Sans',sans-serif;letter-spacing:.04em;color:var(--ink-2)\">{{ discLocProgress }}<\u002Fdiv>\n<\u002Fsc-if>\n<sc-if value=\"{{ discViewMissing }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:10px;padding:10px 12px;background:var(--surface);border:1px dashed var(--line-2);border-radius:10px;font:400 10px/1.5 'Public Sans',sans-serif;color:var(--ink-3);text-wrap:pretty\">The linked stocktake isn\u2019t on this device, so the per-area breakdown can\u2019t be shown. Variance figures are still here.<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<div style=\"flex:1;overflow:auto;padding:14px 16px 44px;display:flex;flex-direction:column;gap:10px\">\n<sc-for list=\"{{ discRows }}\" as=\"ri\" hint-placeholder-count=\"0\">\n<div style=\"padding:13px 14px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card-shadow)\">\n<div style=\"display:flex;align-items:baseline;gap:10px\">\n<span style=\"flex:1;min-width:0;font:600 13px/1.25 'Public Sans',sans-serif;color:var(--ink);text-wrap:pretty\">{{ ri.name }}<\u002Fspan>\n<span style=\"flex:none;text-align:right\"><span style=\"font:700 16px/1 'Public Sans',sans-serif;color:{{ ri.varInk }}\">{{ ri.varUnits }}<\u002Fspan><span style=\"display:block;margin-top:2px;font:500 7.5px/1 'Public Sans',sans-serif;letter-spacing:.1em;color:var(--ink-3)\">VAR UNITS<\u002Fspan><\u002Fspan>\n<\u002Fdiv>\n<div style=\"margin-top:5px;font:400 10px/1.4 'Public Sans',sans-serif;color:var(--ink-3)\">{{ ri.qtyLine }}<\u002Fdiv>\n<sc-if value=\"{{ ri.located }}\" hint-placeholder-val=\"{{ true }}\">\n<div style=\"margin-top:10px;display:flex;flex-direction:column;gap:1px;border-top:1px solid var(--surface-3)\">\n<sc-for list=\"{{ ri.locs }}\" as=\"pl\" hint-placeholder-count=\"2\">\n<button onClick=\"{{ pl.tap }}\" style=\"width:100%;display:flex;align-items:center;gap:9px;padding:8px;margin:1px 0;background:{{ pl.rowBg }};border:none;border-radius:8px;cursor:pointer;text-align:left;font-family:'Public Sans',sans-serif\">\n<span style=\"width:22px;height:22px;flex:none;border-radius:6px;background:{{ pl.tint }};display:flex;align-items:center;justify-content:center;font:600 8.5px/1 'Public Sans',sans-serif;color:{{ pl.tintInk }}\">{{ pl.abbr }}<\u002Fspan>\n<span style=\"flex:1;min-width:0;font:500 11.5px/1.2 'Public Sans',sans-serif;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap\">{{ pl.name }}<\u002Fspan>\n<sc-if value=\"{{ pl.good }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"flex:none;font:700 11.5px/1 'Public Sans',sans-serif;color:var(--ok)\">\u2713 {{ pl.units }}<\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{ pl.recount }}\" hint-placeholder-val=\"{{ false }}\">\n<span style=\"flex:none;display:flex;align-items:baseline;gap:5px\"><span style=\"font:400 9.5px/1 'Public Sans',sans-serif;color:var(--ink-4);text-decoration:line-through\">{{ pl.units }}<\u002Fspan><span style=\"font:700 11.5px/1 'Public Sans',sans-serif;color:var(--warn)\">\u2713 {{ pl.newVal }}<\u002Fspan><\u002Fspan>\n<\u002Fsc-if>\n<sc-if value=\"{{ pl.unchecked }}\" hint-placeholder-val=\"{{ true }}\">\n<span style=\"flex:none;display:flex;align-items:center;gap:6px\"><span style=\"font:600 12.5px/1 'Public Sans',sans-serif;color:var(--ink)\">{{ pl.units }}<\u002Fspan><span style=\"font:400 nt:700 18px/1.2 'Public Sans',sans-serif;color:var(--ink)\">Counted twice<\u002Fdiv>\n<button onClick=\"{{ closeClashes }}\" style=\"width:28px;height:28px;border:1px solid var(--line);background:var(--surface);border-radius:8px;cursor:pointer;font:400 12px/1 'Public Sans',sans-serif;color:var(--ink-2)\">\u2715<\u002Fbutton>\n<\u002Fdiv>\n<p style=\"margin:9px 0 0;font:400 12.5px/1.6 'Public Sans',sans-serif;color:var(--ink-2);text-wrap:pretty\">{{ clashBlurb }}<\u002Fp>\n<div style=\"margin-top:14px;display:flex;flex-direction:column;gap:8px\">\n<sc-for list=\"{{ clashes }}\" as=\"c\" hint-placeholder-count=\"2\">\n<div style=\"padding:12px;background:var(--surface);border:1px solid var(--line);border-radius:12px;box-shadow:var(--card-shadow)\">\n<div style=\"font:500 12px/1.3 'Public Sans',sans-serif;color:var(--ink)\">{{ c.name }}<\u002Fdiv>\n<div style=\"margin-top:9px;display:flex;gap:7px\">\n<button onClick=\"{{ c.keepMine }}\" style=\"flex:1;padding:10px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;font:500 10.5px/1.3 'Public Sans',sans-serif;color:var(--ink);box-shadow:var(--inset-shadow)\">{{ c.mine }}<\u002Fbutton>\n<button onClick=\"{{ c.keepTheirs }}\" style=\"flex:1;padding:10px;border-radius:9px;background:var(--surface-3);border:1px solid var(--line-2);cursor:pointer;font:500 10.5px/1.3 'Public Sans',sans-serif;color:var(--ink);box-shadow:var(--inset-shadow)\">{{ c.theirs }}<\u002Fbutton>\n<\u002Fdiv>\n<sc-if value=\"{{ notAdmin }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"margin-top:8px;font:500 9px/1 'Public Sans',sans-serif;letter-spacing:.1em;color:var(--ink)\">{{ clashAction }}<\u002Fdiv>\n<\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fsc-for>\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fsc-if>\n\n<\u002Fdiv>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script data-props=\"{&quot;accent&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#FFFFFF&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#FFFFFF&quot;,&quot;var(--ok)&quot;,&quot;#FFFFFF&quot;,&quot;var(--warn)&quot;],&quot;section&quot;:&quot;Look&quot;},&quot;showClashes&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Behaviour&quot;}}\">\nconst TINTS = [\n  {tint:\"var(--tint0)\", tintInk:\"var(--tint0i)\"},\n  {tint:\"var(--tint1)\", tintInk:\"var(--tint1i)\"},\n  {tint:\"var(--tint2)\", tintInk:\"var(--tint2i)\"},\n  {tint:\"var(--tint3)\", tintInk:\"var(--tint3i)\"},\n  {tint:\"var(--tint4)\", tintInk:\"var(--tint4i)\"}\n];\nconst LEGACY = \"stocktake.setup.v1\";\nconst CLOUD = \"stocktake.cloud.v1\";\n/* Settings-type fields synced by last-writer-wins per-field timestamp (metaAt),\n   so a device with a stale value can never overwrite a newer one across devices. */\nconst META_FIELDS = [\"title\",\"locNames\",\"hidden\",\"hideEmpty\"];\n\n/* Supabase: paste the project URL and anon key here (or set window.STOCKTAKE_SB\n   before this script). Left blank, the app falls back to the same-browser store. */\nconst SB = {\n  url: (typeof window!==\"undefined\" && window.STOCKTAKE_SB && window.STOCKTAKE_SB.url) || \"https://ijzuvrwcfipvsxbxginz.supabase.co\",\n  key: (typeof window!==\"undefined\" && window.STOCKTAKE_SB && window.STOCKTAKE_SB.key) || \"eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImlqenV2cndjZmlwdnN4YnhnaW56Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODc3MzU2OTgsImV4cCI6MjEwMzMxMTY5OH0.eOlxDqeEFthSulxOLnMUHYiSDOI9hd55KjCuLr8SdXo\",\n  on(){ return !!(this.url && this.key); },\n  /* Rows private to one signed-in account: their profile, personal past-stocktakes,\n     active-stocktake pointer and membership. Requests for these carry the user's\n     auth token so the database (RLS) can enforce owner-only access. Every other row\n     (stocktakes, org data) stays on the anon key, so anonymous counters keep working\n     and an expired token can never break the counting/sync path. */\n  personal(code){ return /^(p:|a:|u:|m:)/.test(code||\"\"); },\n  token(){\n    try{\n      const s = JSON.parse(localStorage.getItem(\"stocktake.auth.v1\")||\"null\");\n      if(!s || !s.access_token) return null;\n      const p = JSON.parse(atob(s.access_token.split(\".\")[1].replace(/-/g,\"+\").replace(/_/g,\"/\")));\n      if(p && p.exp && (p.exp*1000) > Date.now()+5000) return s.access_token; // still valid\n      return null;\n    }catch(e){ return null; }\n  },\n  /* The raw stored access token, WITHOUT the local expiry check token() does.\n     Personal-row requests send this so the SERVER decides whether it is still\n     valid \u2014 a device whose clock is wrong would otherwise wrongly judge a good\n     token \"expired\", silently fall back to the anon key, and get an empty result\n     (RLS hides the row), which looks exactly like a lost profile / empty archive. */\n  rawToken(){ try{ const s=JSON.parse(localStorage.getItem(\"stocktake.auth.v1\")||\"null\"); return (s&&s.access_token)||null; }catch(e){ return null; } },\n  /* Set by the app to a function that refreshes the access token and resolves\n     true/false. _sbFetch calls it to recover from a 401/403 on a personal row. */\n  _refresh:null,\n  head(code){\n    let bearer = this.key;\n    if(this.personal(code)){ bearer = this.rawToken() || this.key; }\n    return {apikey:this.key, Authorization:\"Bearer \"+bearer, \"Content-Type\":\"application/json\"};\n  },\n  /* Issue a request; if a personal row comes back 401/403 (token expired or\n     missing), refresh the session once and re-issue before giving up. */\n  _sbFetch(go, code){\n    return go().then(r=>{\n      if((r.status===401 || r.status===403) && this.personal(code) && typeof this._refresh===\"function\"){\n        return Promise.resolve(this._refresh()).then(ok=> ok ? go() : r, ()=>r);\n      }\n      return r;\n    });\n  },\n  get(code){\n    const go = ()=> fetch(this.url+\"/rest/v1/stocktakes?code=eq.\"+encodeURIComponent(code)+\"&select=doc\",\n      {headers:this.head(code)});\n    return this._sbFetch(go, code)\n      .then(r=>{ if(!r.ok) throw new Error(r.status); return r.json(); })\n      .then(rows=>(rows && rows[0] && rows[0].doc) || null);\n  },\n  put(code, doc){\n    const go = ()=> fetch(this.url+\"/rest/v1/stocktakes\",\n      {method:\"POST\", headers:Object.assign({Prefer:\"resolution=merge-duplicates\"}, this.head(code)),\n       body:JSON.stringify({code:code, doc:doc})});\n    return this._sbFetch(go, code)\n      .then(r=>{ if(!r.ok) throw new Error(r.status); return true; });\n  }\n};\n\n/* Supabase Auth (GoTrue) over REST. Uses the same project url + anon key.\n   Session persists in localStorage; a Google redirect returns tokens in the\n   URL hash, which componentDidMount reads once on load. */\nconst AUTHKEY = \"stocktake.auth.v1\";\nconst LASTG = \"stocktake.lastgoogle.v1\"; // remember the last Google email so we can double-check the account on next sign-in\nconst OWNCODE = \"stocktake.owncode.v1\"; // per-account map { uid: code } of the admin's active, unfinalised stocktake so login can reopen it\nconst DEVKEY = \"stocktake.device.v1\";\n/* One stable id per device so a participant is a single row in the shared\n   people list \u2014 retyping a name updates that row instead of adding a new one. */\nconst DEVICE = (()=>{ try{ let d = localStorage.getItem(DEVKEY); if(!d){ d = \"d\"+Date.now().toString(36)+Math.random().toString(36).slice(2,8); localStorage.setItem(DEVKEY, d); } return d; }catch(e){ return \"d\"+Math.random().toString(36).slice(2,10); } })();\nconst AUTH = {\n  base(){ return SB.url + \"/auth/v1\"; },\n  h(){ return {apikey:SB.key, \"Content-Type\":\"application/json\"}; },\n  _res(r){ return r.json().then(j=>{ if(!r.ok) throw (j && (j.error_description||j.msg||j.error||j.message)) || (\"Request failed (\"+r.status+\")\"); return j; }); },\n  signup(email,pw){ return fetch(this.base()+\"/signup\",{method:\"POST\",h
